name: Release

# 打 v* tag 时：构建 sdist/wheel → twine check → 发布 PyPI（trusted publishing）
# → 把 packaging/quickstart 打成 zip 挂到 GitHub Release。
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build & verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check tag matches package version
        run: |
          VERSION=$(python -c "import dba_pipeline; print(dba_pipeline.__version__)")
          if [ "v$VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match v$VERSION"
            exit 1
          fi

      - name: Build sdist & wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - name: Package quickstart zip
        run: |
          cd packaging/quickstart
          zip -r "${GITHUB_WORKSPACE}/quickstart.zip" . -x "*.DS_Store"

      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: quickstart
          path: quickstart.zip

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ariadne-mcp-server
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Attach quickstart to release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: quickstart
      - uses: softprops/action-gh-release@v2
        with:
          files: quickstart.zip
          generate_release_notes: true
