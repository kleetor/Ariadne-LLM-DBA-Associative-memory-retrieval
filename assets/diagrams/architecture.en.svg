      <rect x="300" y="100" width="200" height="84" rx="9"/>
      <rect x="540" y="100" width="130" height="84" rx="9"/>
      <rect x="710" y="100" width="170" height="84" rx="9"/>
      <rect x="920" y="100" width="160" height="84" rx="9"/>
      <rect x="1120" y="100" width="210" height="84" rx="9"/>
      <rect x="1370" y="100" width="270" height="84" rx="9"/>
    </g>
    <g font-size="14" fill="#2A2A2A">
      <text x="320" y="128">Maintenance scheduler</text><text x="320" y="150" font-size="11" fill="#8A857C">idle 90s · batch of 6</text>
      <text x="556" y="128">triage</text><text x="556" y="150" font-size="11" fill="#8A857C">short text only</text>
      <text x="726" y="128">Node extraction</text><text x="726" y="150" font-size="11" fill="#8A857C">LLM · typed nodes</text>
      <text x="936" y="128">Edge linking</text><text x="936" y="150" font-size="11" fill="#8A857C">LLM · 8 relation types</text>
      <text x="1136" y="128">GraphBuilder</text><text x="1136" y="150" font-size="11" fill="#8A857C">dedupe · deprecate · orphans</text>
      <text x="1386" y="128">Write graph + vectors</text><text x="1386" y="150" font-size="11" fill="#8A857C">add_memories · atomic YAML</text>
    </g>
    <g stroke="#B3ACA0" stroke-width="1.6" fill="none">
      <path d="M250 129 L296 129" marker-end="url(#arrow)"/>
      <path d="M500 142 L536 142" marker-end="url(#arrow)"/>
      <path d="M670 142 L706 142" marker-end="url(#arrow)"/>
      <path d="M880 142 L916 142" marker-end="url(#arrow)"/>
      <path d="M1080 142 L1116 142" marker-end="url(#arrow)"/>
      <path d="M1330 142 L1366 142" marker-end="url(#arrow)"/>
    </g>
    <text x="300" y="196" font-size="11" fill="#A9A296">Returns as soon as queued; persistence runs in a background worker under the cross-process file lock.</text>

    <rect x="300" y="214" width="700" height="92" rx="10" fill="#FDFCF8" stroke="#D9D3C7" stroke-dasharray="6 4"/>
    <text x="318" y="236" font-size="11.5" fill="#8A857C">ALM parallel path · separate process · one space per user_id · no cross-process lock</text>
    <g fill="#FFFFFF" stroke="#D9D3C7">
      <rect x="318" y="246" width="170" height="44" rx="7"/>
      <rect x="516" y="246" width="180" height="44" rx="7"/>
      <rect x="726" y="246" width="254" height="44" rx="7"/>
    </g>
    <g font-size="13" fill="#2A2A2A">
      <text x="332" y="273">MemorySpace</text>
      <text x="530" y="273">Same DBA classes</text>
      <text x="740" y="273">Per-space YAML + FAISS</text>
    </g>
    <g font-size="10.5" fill="#8A857C">
      <text x="530" y="286">no scheduler · no write_guard</text>
      <text x="740" y="286">one directory per user</text>
    </g>
    <g stroke="#B3ACA0" stroke-width="1.6" fill="none">
      <path d="M250 253 L314 262" marker-end="url(#arrow)"/>
      <path d="M488 268 L512 268" marker-end="url(#arrow)"/>
      <path d="M696 268 L722 268" marker-end="url(#arrow)"/>
    </g>

    <path d="M250 339 L330 339 L330 452" stroke="#B3ACA0" stroke-width="1.6" stroke-dasharray="6 4" fill="none" marker-end="url(#arrow)"/>
    <text x="342" y="392" font-size="11" fill="#A9A296">Writes YAML directly, bypassing DBA (same file lock)</text>

    <!-- ================= 2. Storage & state ================= -->
    <text x="40" y="444" font-size="16" fill="#6B6559" letter-spacing="1">② Storage &amp; state</text>
    <text x="196" y="444" font-size="10" fill="#B0A99C" letter-spacing="3">STATE</text>

    <rect x="40" y="456" width="1600" height="214" rx="14" fill="#FFFFFF" stroke="#E6E1D6"/>

    <g fill="#FFFFFF" stroke="#D9D3C7">
      <rect x="70" y="486" width="330" height="76" rx="9"/>
      <rect x="430" y="486" width="300" height="76" rx="9"/>
      <rect x="760" y="486" width="280" height="76" rx="9"/>
      <rect x="1070" y="486" width="270" height="76" rx="9"/>
      <rect x="1370" y="486" width="250" height="76" rx="9"/>
    </g>
    <g font-size="14" fill="#2A2A2A">
      <text x="86" y="512">MemoryGraph (networkx)</text>
      <text x="446" y="512">VectorStore (FAISS)</text>
      <text x="776" y="512">KeywordIndex (inverted)</text>
      <text x="1086" y="512">Graph YAML + pointer file</text>
      <text x="1386" y="512">sources/ raw batches</text>
    </g>
    <g font-size="11" fill="#8A857C">
      <text x="86" y="534">nodes · edges · jump weights · persisted fields</text>
      <text x="86" y="550">in-memory, shared by MCP / panel / retriever</text>
      <text x="446" y="534">content vectors + query / purpose vectors</text>
      <text x="446" y="550">not persisted by default; checkpoint optional</text>
      <text x="776" y="534">ASCII tokens + CJK bigrams</text>
      <text x="776" y="550">title / tags weighted, no vectors</text>
      <text x="1086" y="534">active_graph.json · atomic write</text>
      <text x="1086" y="550">&lt;yaml&gt;.lock cross-process</text>
      <text x="1386" y="534">redacted · 30-day TTL · opt-in</text>
      <text x="1386" y="550">for source audit</text>
    </g>

    <g fill="#FBFAF6" stroke="#E0DACE">
      <rect x="70" y="578" width="250" height="44" rx="7"/>
      <rect x="340" y="578" width="250" height="44" rx="7"/>
      <rect x="610" y="578" width="290" height="44" rx="7"/>
      <rect x="920" y="578" width="300" height="44" rx="7"/>
    </g>
    <g font-size="12" fill="#6B6559">
      <text x="86" y="605">operations.log (JSONL audit)</text>
      <text x="356" y="605">reviews/ · snapshots/ (audit)</text>
      <text x="626" y="605">Retrieval params (hot reload)</text>
      <text x="936" y="605">Offline HTML export (reads YAML)</text>
    </g>
    <text x="70" y="644" font-size="11" fill="#A9A296">Writes: temp file + os.replace; a cross-process lock serializes MCP maintenance and panel CRUD.</text>
    <text x="70" y="660" font-size="11" fill="#A9A296">In-process _lock guards graph reads/writes; _runtime_lock isolates graph switching from retrieval.</text>

    <path d="M1505 184 L1505 452" stroke="#B3ACA0" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
    <text x="1512" y="330" font-size="11" fill="#A9A296">persist</text>

    <!-- ================= 3. Read path ================= -->
    <text x="40" y="700" font-size="16" fill="#3E7C77" letter-spacing="1">③ Read path</text>
    <text x="158" y="700" font-size="10" fill="#8FB3AF" letter-spacing="3">READ</text>

