    <text x="40" y="52" font-size="16" fill="#B9784E" letter-spacing="1">① Write path</text>
    <text x="172" y="52" font-size="10" fill="#C9A48A" letter-spacing="3">WRITE</text>

    <rect x="40" y="100" width="210" height="58" rx="9" fill="#FFFFFF" stroke="#D9D3C7"/>
    <text x="60" y="124" font-size="14" fill="#2A2A2A">MCP tools</text>
    <text x="60" y="142" font-size="11" fill="#8A857C">add_conversation</text>

    <rect x="40" y="214" width="210" height="58" rx="9" fill="#FFFFFF" stroke="#D9D3C7"/>
    <text x="60" y="238" font-size="14" fill="#2A2A2A">ALM /add</text>
    <text x="60" y="256" font-size="11" fill="#8A857C">isolated space per user_id</text>

    <rect x="40" y="310" width="210" height="58" rx="9" fill="#FFFFFF" stroke="#D9D3C7"/>
    <text x="60" y="334" font-size="14" fill="#2A2A2A">3D panel CRUD</text>
    <text x="60" y="352" font-size="11" fill="#8A857C">create / update / delete</text>

