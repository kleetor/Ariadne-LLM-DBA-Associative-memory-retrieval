    <text x="60" y="782" font-size="11" fill="#8A857C">MCP · panel · ALM /search</text>

    <rect x="40" y="918" width="210" height="64" rx="9" fill="#FFFFFF" stroke="#D9D3C7"/>
    <text x="60" y="944" font-size="14" fill="#2A2A2A">Knowledge query</text>
    <text x="60" y="964" font-size="11" fill="#8A857C">dba_query_knowledge</text>

