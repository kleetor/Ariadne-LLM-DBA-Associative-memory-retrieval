      <text x="536" y="754">Jump axis</text>
      <text x="746" y="754">Purpose regression</text>
      <text x="946" y="754">Peak termination</text>
      <text x="1156" y="754">StoryRank</text>
      <text x="1366" y="754">Story fragments</text>
    </g>
    <g font-size="11" fill="#8A857C">
      <text x="316" y="776">top-K vectors + purpose</text>
      <text x="536" y="776">6 roles × 8 edge types</text>
      <text x="746" y="776">filters each hop</text>
      <text x="946" y="776">slope &lt; 0 → peak band</text>
      <text x="1156" y="776">LLM narrative</text>
      <text x="1366" y="776">stories · story_used</text>
    </g>
    <g font-size="10.5" fill="#B0A99C">
      <text x="316" y="794">VectorStore.search</text>
      <text x="536" y="794">expand_with_trace</text>
      <text x="746" y="794">PurposeModel</text>
      <text x="946" y="794">PeakFinder</text>
      <text x="1156" y="794">inference.story_rank</text>
      <text x="1366" y="794">returned to caller</text>
    </g>

