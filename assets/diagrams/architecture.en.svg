    <text x="300" y="1014" font-size="11" fill="#A9A296">Notes (metadata.channel=note) also enter the vector store and can seed PAR, but never take part in edge linking.</text>

    <path d="M400 676 L400 722" stroke="#B3ACA0" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
    <text x="408" y="704" font-size="11" fill="#A9A296">vector read</text>
    <path d="M650 676 L650 722" stroke="#B3ACA0" stroke-width="1.6" stroke-dasharray="6 4" fill="none" marker-end="url(#arrow)"/>
    <text x="658" y="704" font-size="11" fill="#A9A296">graph expansion</text>
    <path d="M270 676 L270 942 L296 942" stroke="#B3ACA0" stroke-width="1.6" stroke-dasharray="6 4" fill="none" marker-end="url(#arrow)"/>

    <text x="40" y="1064" font-size="11.5" fill="#8A857C">LLM calls: triage · node extraction · edge linking · purpose inference · StoryRank　|　Embeddings: nodes / query / purpose / dedupe　|　Human edits: panel CRUD and dba_intervene share the same file lock</text>

    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0 0 L10 5 L0 10 z" fill="#B3ACA0"/>
      </marker>
    </defs>
  </g>
</svg>
