<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1120" viewBox="0 0 1680 1120">
  <rect width="1680" height="1120" fill="#FAF9F5"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">

    <!-- ================= Legend ================= -->
    <g font-size="11.5" fill="#8A857C">
      <line x1="1380" y1="58" x2="1416" y2="58" stroke="#B3ACA0" stroke-width="1.6"/>
