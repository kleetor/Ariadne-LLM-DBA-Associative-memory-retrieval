      <text x="316" y="928">Keyword search</text>
      <text x="556" y="928">Rerank (optional)</text>
      <text x="776" y="928">Note hits</text>
    </g>
    <g font-size="11" fill="#8A857C">
      <text x="316" y="950">ASCII + CJK bigrams</text>
      <text x="556" y="950">HTTP cross-encoder</text>
      <text x="776" y="950">literal match, not vector</text>
    </g>
    <g font-size="10.5" fill="#B0A99C">
      <text x="316" y="968">KeywordIndex.search</text>
      <text x="556" y="968">falls back to keyword order</text>
      <text x="776" y="968">returns note list</text>
    </g>
    <g stroke="#B3ACA0" stroke-width="1.6" fill="none">
      <path d="M250 950 L296 950" marker-end="url(#arrow)"/>
      <path d="M500 942 L536 942" marker-end="url(#arrow)"/>
      <path d="M720 942 L756 942" marker-end="url(#arrow)"/>
