# LiFEMem 查询集 v3（陈述触发式 · 对话记忆范式）
#
# 范式纠正（2026-08-18）：
#   真实对话中用户与 LLM 是「我/你」关系——用户**表达状态**（如「压力好大」），
#   不做明确提问（提问是 RAG 知识库的事）。记忆系统在**无明确提问**的语境下触发：
#   陈述 → 目的推断（隐含状态与目的）→ 联想检索 → 搜集相关记忆 → 生成有记忆的回应。
#
# 本查询集将 35 条查询重构为**用户第一人称陈述**：
#   - text：用户对 LLM 说的话（无「？」式提问）
#   - purpose_hint：该陈述的隐含目的（设计参考，不输入系统）
#   - expected：该陈述应触发联想的关键记忆集（评测参考，非一对一的"正确答案"）
#   - no_gold：开放陈述（联想目标宽泛，以 CROSS_VALID 为主）
#   - 弃权类：陈述隐含图中不存在的信息，测试系统不强行联想

meta:
  dataset: LiFEMem
  version: v3
  paradigm: statement-triggered
  metric:
    - 目的推断合理性
    - 联想召回（expected 覆盖）
    - 故事质量五维（主指标）
    - CROSS_VALID 合理联想率（主指标）
    - 弃权正确率

queries:
  # ============ 工作 / 压力 ============
