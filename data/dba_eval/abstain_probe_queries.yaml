# 弃权阈值专项探针集（标定 ALM_ABSTAIN_COS）
#
# 目的：在**余弦整体偏低**的查询上，看 0.52 是偏严还是偏松，并扫出整条 A/H 权衡曲线。
#
# 为什么能离线扫阈值：弃权只看 `best_cos`（候选与查询的最大余弦），**不调用任何 LLM**。
#   因此脚本先在 `ALM_ABSTAIN_COS=0`（强制不弃权）下把每条查询跑一遍，记下该查询的
#   best_cos 与"实际能命中哪些 gold_fact"，之后任意阈值的表现都能由这两项推出来。
#
# 两类样本：
#   answer    —— 库里**有**答案，但措辞刻意与节点原文拉开距离（上位词 / 同义替换 /
#                间接提问），用来压出低余弦。这类被弃权 = 直接丢 A 维度分。
#   no_answer —— 库里**没有**对应记忆（换成完全无关话题）。这类不弃权 = 丢 H 维度分。
#
# 关键看点：两类样本的余弦若在区间上重叠，则**不存在能同时兼顾 A 与 H 的阈值**——
#   这正是决定性证据：要么接受一个折中点，要么给判据加门控（如内容词交集）。

- id: a01
  type: answer
  note: 上位词（锻炼 ← 跑步/羽毛球）
  query: 群里有人在做锻炼吗，具体是什么项目？
  gold_facts: [跑步, 羽毛球]

