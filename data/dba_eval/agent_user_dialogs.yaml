dialogs:
- id: d01
  scene: 工作开发
  covers:
  - uw1
  - aw1
  - tw1
  - uw2
  - aw2
  - tw2
  - uw3
  turns:
  - role: user
    time: 09:00
    text: 哎，我这周真的忙疯了，每天加班到十一点，项目赶得不行。
  - role: assistant
    time: 09:05
    text: 辛苦辛苦，我帮你把下周的排期整理成清单了，还标了优先级，你看一眼？
  - role: user
    time: 09:10
    text: 谢啦。不过周一晚上我临时接了个紧急需求，可能得插进去。
  - role: assistant
    time: 09:15
    text: 行，那我回头把那个需求加进去。对了，周三白天有个需求评审会，我也在清单里标出来了。
  - role: user
    time: 09:20
    text: 嗯，周二白天我还能喘口气，周三会开完估计又要接着赶。
  - role: assistant
    time: 09:25
    text: 没事，反正清单都给你排好了，你先按优先级来，紧急需求我帮你放前面。
  temporal: true
- id: d02
  scene: 工作开发
  covers:
  - uw4
  - aw3
  - tw3
  - uw5
  - aw4
  - tw4
  - uw6
  turns:
  - role: user
    time: 09:00
    text: 哎，周三凌晨上线那会儿真是手忙脚乱，幸亏你当时帮我用Python写了个自动拆分任务的脚本，不然我估计得手动拆到天亮。
  - role: assistant
    time: 09:05
    text: 哈哈，那会儿看你急得不行，我就顺手写了。不过话说回来，上线的时候不是还出了个P0级严重故障吗？当时你整个人都不好了。
  - role: user
    time: 09:10
    text: 可不是嘛，周三凌晨那个P0故障差点把我搞崩溃，还好你帮我梳理了排查要点，不然我连从哪儿下手都不知道。
  - role: assistant
    time: 09:15
    text: 嗯，那会儿我也就是帮你把可能的原因按优先级列了个清单，后面你不是周四深夜直接通宵定位修复了吗？效率其实挺高的。
  - role: user
    time: 09:20
    text: 别提了，周四深夜那会儿我真是熬到眼冒金星，不过最后总算把故障给解决了，现在想想也算值了。
  - role: assistant
    time: 09:25
    text: 辛苦辛苦，这种事儿经历过一次就有经验了，下次再上线应该能稳不少。
  temporal: true
- id: d03
  scene: 工作开发
  covers:
  - uw7
  - aw5
  - tw5
  - uw8
  - aw6
  - tw6
  - uw9
  turns:
  - role: user
    time: 09:00
    text: 哎，周五那个项目复盘会真是累人，光整理提纲就花了我半天。
  - role: assistant
    time: 09:03
    text: 那会儿我帮你把复盘提纲生成好了，你直接用就行，省了不少事吧？
  - role: user
    time: 09:10
    text: 是省了点，但会上又临时加需求，搞得我特别烦躁，真想拍桌子。
  - role: assistant
    time: 09:15
    text: 加需求确实烦。不过我后来给你推荐的那个压测工具，你试了吗？应该能帮你顶一顶。
  - role: user
    time: 09:22
    text: 还没试呢，这周天天加班，人都快散架了，实在没精力。
  - role: assistant
    time: 09:25
    text: 理解，你先歇会儿吧，工具我帮你留着，等缓过来再说。
  temporal: true
- id: d04
  scene: 工作开发
  covers:
  - uw10
  - aw7
  - tw7
  - uw11
  - aw8
  - aw9
  turns:
  - role: user
    time: 09:12
    text: 哎，我这周又踩了个坑，调试了半天才搞定，回头我写篇技术笔记存着。
  - role: assistant
    time: 09:15
    text: 行啊，我上周帮你把之前那些笔记整理成文档了，回头你直接往里加就行。
  - role: user
    time: 09:20
    text: 谢啦！不过说实话，最近加班太狠了，我下周真有点想换个有双休的团队，至少能喘口气。
  - role: assistant
    time: 09:23
    text: 理解理解，我帮你对比了几个双休团队的在招岗位，薪资和方向都标好了，你看完再定。
  - role: user
    time: 09:26
    text: 太好了，我今晚回去仔细看看。就是有点舍不得现在的项目，但身体要紧啊。
  - role: assistant
    time: 09:28
    text: 嗯，连续加班真的伤，你自己注意休息，别硬扛。文档和岗位对比我都发你邮箱了，随时看。
  temporal: true
- id: d05
  scene: 日常起居/健康
  covers:
  - ud1
  - ad1
  - td1
  - ud2
  - ad2
  - td2
  - ud3
  turns:
  - role: user
    time: 08:15
    text: 哎，我昨天早上本来想照常绕小区晨跑半小时的，结果睡过头了，愣是没跑成。
  - role: assistant
    time: 08:20
    text: 哈哈，没事，我昨天已经帮你把这一周的晨跑安排都写进日历里了，明天开始按点提醒你。
  - role: user
    time: 08:35
    text: 对了，上周一我去体检了，报告说脂肪有点高，让我注意饮食。
  - role: assistant
    time: 08:40
    text: 那我正好帮你整理了一份减脂餐食谱，回头发你，照着吃就行。
  - role: user
    time: 08:50
    text: 行，谢啦。不过说实话，昨天没跑成，心里总觉得缺点啥。
  - role: assistant
    time: 08:55
    text: 那今天傍晚补上呗，反正我已经在日历里给你留了空档。
  temporal: true
- id: d06
  scene: 日常起居/健康
  covers:
  - ud4
  - ad3
  - td3
  - ud5
  - ad4
  - td4
  - ud6
  turns:
  - role: user
    time: 09:00
    text: 哎，跟你说，我这次体检报告出来了，指标居然比去年好了一些，挺意外的。
  - role: assistant
    time: 09:02
    text: 那不错啊！不过我觉得你这周开始吃减脂餐，肯定也有功劳吧？我昨天帮你把附近几家健身房的年卡都对比了一遍，等你有空可以看看。
  - role: user
    time: 09:05
    text: 哈哈，减脂餐确实吃得挺认真，但我觉得改善作息才是关键，反正我自己挺有成就感的。
  - role: assistant
    time: 09:07
    text: 成就感就得保持住！对了，我提醒你一下，从明天开始最好每天记录睡眠时间，这样能更清楚作息改善的效果。
  - role: user
    time: 09:10
    text: 行，我记下了。其实这周睡得早，感觉精神头都不一样了，明天继续早点睡。
  - role: assistant
    time: 09:12
    text: 好嘞，那明天睡前我帮你定个闹钟提醒，顺便把健身房的对比结果发你微信，你看完咱们再聊。
  temporal: true
- id: d07
  scene: 日常起居/健康
  covers:
  - ud7
  - ad5
  - td5
  - ud8
  - ad6
  - ud9
  turns:
  - role: user
    time: 09:00
    text: 哎，我最近总觉得自己状态不太对，晚上老是磨蹭到十二点以后才睡，白天又犯困。
  - role: assistant
    time: 09:03
    text: 你这习惯可不行啊。正好今年你那份体检报告出来了，我帮你把重点摘了出来——睡眠不足加上颈椎的问题，都写在里面了，你自己看看。
  - role: user
    time: 09:05
    text: 还真是……我以前颈椎就不太好，现在更明显了。我打算明天去办张健身卡，练练总比躺着强。
  - role: assistant
    time: 09:08
    text: 行啊，那我给你设计一个循序渐进的作息调整计划，先从每天提前半小时睡开始，再配合简单的拉伸，别一下子整太猛。
  - role: user
    time: 09:10
    text: 行，那我先按你说的来，明天办卡的时候顺便问问有没有合适的课程。
  temporal: true
- id: d08
  scene: 社交/约会
  covers:
  - us1
  - as1
  - ts1
  - us2
  - as2
  - ts2
  - us3
  turns:
  - role: user
    time: 09:00
    text: 哎，上周三去同事生日会，吃得有点撑，这周六又约了朋友聚餐，你帮我想想地方呗？
  - role: assistant
    time: 09:05
    text: 行啊，我帮你列个聚餐地点清单，有火锅、日料和烧烤，你挑一个？
  - role: user
    time: 09:08
    text: 都好，不过周五下班我经常去朋友家打桌游，那附近有家烤肉不错，能订吗？
  - role: assistant
    time: 09:12
    text: 没问题，我帮你订了周六那家餐厅，就按你周五常去那附近的烤肉来，已经确认了。
  - role: user
    time: 09:15
    text: 太感谢了，不然我又得纠结半天。
  - role: assistant
    time: 09:18
    text: 别客气，反正清单里也有备选，到时候想换随时说。
  temporal: true
- id: d09
  scene: 社交/约会
  covers:
  - us4
  - as3
  - ts3
  - us5
  - as4
  - ts4
  - us6
  turns:
  - role: user
    time: 09:00
    text: 哎，周六不是要给我朋友过生日嘛，我礼物都备好了，就是卡片上不知道写啥，你帮我琢磨琢磨？
  - role: assistant
    time: 09:05
    text: 行啊，我帮你写了一段祝福语，挺走心的，你直接抄上去就行。对了，周六聚会别太晚睡，第二天还有事呢。
  - role: user
    time: 09:10
    text: 哈哈知道啦，其实我跟我表妹关系特别好，下周日还打算陪她去逛街呢，可不能顶着黑眼圈。
  - role: assistant
    time: 09:12
    text: 那正好，周六玩归玩，早点撤，别耽误你下周日跟表妹的约会。卡片文案我发你了，你看看合不合适。
  temporal: true
- id: d10
  scene: 社交/约会
  covers:
  - us7
  - ts5
  - us8
  turns:
  - role: user
    time: 09:00
    text: 哎，说真的，我这周一想到周末要跟大伙儿聚会，心里就有点小激动。
  - role: assistant
    time: 09:02
    text: 哈哈，那挺好的呀！你平时不就爱在群里张罗这些嘛，组织活动你最拿手了。
  - role: user
    time: 09:05
    text: 可不是嘛，反正闲着也是闲着，上周我还在群里发了个周末爬山提议呢，结果响应还挺热烈。
  - role: assistant
    time: 09:08
    text: 那这周聚会是你安排的吗？要不要我帮你列个简单的流程清单，免得临时手忙脚乱？
  - role: user
    time: 09:10
    text: 好呀好呀，我正愁呢，你帮我把时间点捋一捋，我心里就有底了。
  - role: assistant
    time: 09:12
    text: 没问题，我待会儿就把从周五晚上到周日中午的安排给你写清楚，你照着说就行。
  temporal: true
- id: d11
  scene: 学习/探索
  covers:
  - ul1
  - al1
  - tl1
  - ul2
  - al2
  - tl2
  - ul3
  turns:
  - role: user
    time: 09:00
    text: 哎，我最近有点想学数据分析，但完全不知道从哪儿下手。
  - role: assistant
    time: 09:02
    text: 这个好办啊，反正你有Python基础，我觉得你先从Python数据分析入门最合适，像pandas、matplotlib这些库用起来很顺手。
  - role: user
    time: 09:05
    text: 对，我确实会点Python，但也就写写简单脚本，真做起分析心里没底。
  - role: assistant
    time: 09:08
    text: 别慌，这周我帮你整理了3个入门项目，比如用爬虫抓点数据做个简单可视化，练完基本就上手了。
  - role: user
    time: 09:10
    text: 哈哈，说到这我想起来了，上周我还报了个数据分析网课，但一直没认真听，正好跟你的项目搭配着来。
  - role: assistant
    time: 09:12
    text: 那就更好了，网课打基础，项目练实战，上周开始学，这周正好实践，节奏刚刚好。
  temporal: true
- id: d12
  scene: 学习/探索
  covers:
  - ul4
  - al3
  - tl3
  - ul5
  - al4
  - tl4
  - ul6
  turns:
  - role: user
    time: 09:00
    text: 哎，这周我简直被网课的作业淹没了，周末还得抽空刷LeetCode，感觉时间完全不够用。
  - role: assistant
    time: 09:05
    text: 理解你，周日嘛，正好可以捋一捋。我之前给你推荐的那门数据分析基础课，其实特别适合你现在的编程底子，要不咱们把它跟网课作业混着安排？
  - role: user
    time: 09:12
    text: 有道理，不过我现在真有点乱，网课作业堆成山，LeetCode也不能落下。
  - role: assistant
    time: 09:18
    text: 别急，我刚帮你把网课作业拆成了每日计划，每天两个小任务，明天开始照做就行，这样周末刷题的时间也能保住。
  - role: user
    time: 09:25
    text: 太好了，其实我心底是想先把数据分析做熟，再慢慢转向AI那边，不想两头都半吊子。
  - role: assistant
    time: 09:30
    text: 那正好，按这个节奏，你数据分析的基础会更扎实，后面转AI也顺理成章，明天按计划走就行。
  temporal: true
- id: d13
  scene: 学习/探索
  covers:
  - ul7
  - al5
  - tl5
  - ul8
  - al6
  - al7
  - al8
  turns:
  - role: user
    time: 09:00
    text: 哎，我明天想把那个数据处理的项目先跑起来，但总感觉心里没底，最近学得有点慌。
  - role: assistant
    time: 09:03
    text: 别急，我上周给你写的那个数据处理示例代码还在吧？先拿那个当起点，跑通了再说。其实你进度不算慢。
  - role: user
    time: 09:06
    text: 代码是在，可我一想到明年还要学那么多，就有点焦虑，怕自己跟不上。
  - role: assistant
    time: 09:09
    text: 我懂，所以我之前帮你把刷题节奏重新排了一下，每天就两三个小时，不用贪多。另外我给你梳理的那条从数据分析到AI的学习路线图，你也照着走就行。
  - role: user
    time: 09:12
    text: 嗯，路线图我看了，就是怕自己坚持不下来。
  - role: assistant
    time: 09:15
    text: 那就先按我给你提的节奏建议来，别想太远，今天搞定一个小任务，明天跑项目，一步步来，焦虑自然会少。
  temporal: true
- id: d14
  scene: 混合闲聊
  covers:
  - um1
  - am1
  - um2
  - am2
  - um3
  - am3
  - um4
  turns:
  - role: user
    time: 09:00
    text: 哎，今天有点感冒，头昏脑胀的，难受死了。
  - role: assistant
    time: 09:02
    text: 那你可得注意点啊，多喝热水，好好休息，别硬撑。我上周也这样，躺了一天就好了。
  - role: user
    time: 09:15
    text: 嗯，刚下楼买了杯热奶茶，暖暖胃，感觉稍微好点。
  - role: assistant
    time: 09:17
    text: 热奶茶确实不错！我知道有一家店，就在街角，他家的奶茶特别醇厚，你下次可以去试试。
  - role: user
    time: '10:30'
    text: 好呀，对了，我其实特别喜欢猫，以前还养过一只橘猫呢，胖乎乎的特别可爱。
  - role: assistant
    time: '10:32'
    text: 哇，橘猫啊！我正好给你讲几个养猫的小贴士，比如要定期梳毛、注意饮食别喂太咸，这样它才能健健康康的。
  temporal: false
- id: d15
  scene: 混合闲聊
  covers:
  - um5
  - am4
  - um6
  - am5
  turns:
  - role: user
    time: 09:00
    text: 哎，昨天我整理东西，发现我家城西那边堆了好多旧书，一直没空收拾。
  - role: assistant
    time: 09:02
    text: 那正好，我这周帮你把今年想做的事列了个清单，第一条就是清理家里的杂物，你看要不要加上这条？
  - role: user
    time: 09:05
    text: 哈哈，你这清单来得及时，我看了下，其实安排得挺顺的，心里还挺满意。
  - role: assistant
    time: 09:07
    text: 那就好，我刚才还陪你聊了会儿天，帮你放松了一下，你感觉怎么样？
  - role: user
    time: 09:10
    text: 舒服多了，这么一聊，感觉周末都有干劲了。
  temporal: true
