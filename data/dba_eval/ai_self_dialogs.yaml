# AI 自身经历/行为抽取 · 专项对话语料
#
# 验证 DBA 节点抽取器不再只记「用户」的事实，也能把「助手」为响应用户请求
# 实际做过的事抽成独立记忆节点（content 以「助手」开头）。
#
# 覆盖 3 类场景：
#   a01  用户新事实 + 助手具体产出（整理清单 / 写脚本）——常规
#   a02  用户透露意愿 + 助手给出具体建议（推荐课程 / 整理项目清单）——常规
#   a03  用户无新事实、仅为助手产出收尾（生成文档）——验证 triage 把「助手做了事」判为 NEEDED
#
# 每批 turns 由验证脚本拼接为 dba.maintain() 的 conversation 文本。

subset:
  name: ai_self_behaviors
  description: 校验 DBA 能抽取「助手自身经历/行为」为记忆节点
  scenes: [项目排期整理, 学习规划, 文档产出]

dialogs:
  # ============ 批 1：项目赶 + 助手整理排期清单/写脚本 ============
  - id: a01
    scene: 项目排期整理
    turns:
      - role: user
        time: 周一 10:00
        text: 哎，我这周项目特别赶，每天都要加班到十一点，快撑不住了。
      - role: assistant
        time: 周一 10:01
        text: 那辛苦了。我帮你把下周的排期整理成一份清单吧，按优先级排好，每项都标上截止时间。
      - role: user
        time: 周一 10:02
        text: 行，你顺便把会议时间也标出来。
      - role: assistant
        time: 周一 10:03
        text: 好，我标了周三下午两点的需求评审会。另外我写了一个 Python 脚本，可以自动把这些任务拆成子项，你之后能用。

  # ============ 批 2：想学数据分析 + 助手推荐课程/整理入门项目 ============
  - id: a02
    scene: 学习规划
    turns:
      - role: user
        time: 周三 20:00
        text: 最近想学学数据分析，又不知道从哪下手，你有什么建议吗？
      - role: assistant
        time: 周三 20:01
        text: 建议你先从 Python 起步。我给你整理了 3 个入门项目，都是练手就能出结果的，也推荐了一门你之前的编程基础比较合适的基础课。
      - role: user
        time: 周三 20:02
        text: 好，那我先按你说的试一下。

  # ============ 批 3：用户仅收尾 + 助手生成文档（无用户新事实） ============
  - id: a03
    scene: 文档产出
    turns:
      - role: user
        time: 周五 09:30
        text: 那就按这个思路来吧。
      - role: assistant
        time: 周五 09:31
        text: 好的，我把刚才讨论的方案整理成了一份 Markdown 文档，也顺手生成了配套的 check-list，你回头发我邮箱。
      - role: user
        time: 周五 09:32
        text: 辛苦了，谢谢。
