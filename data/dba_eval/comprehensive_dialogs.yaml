dialogs:
- id: d01
  scene: 学生时代/高中
  covers:
  - uh1
  - ah1
  - th1
  - uh2
  - ah2
  - th2
  - uh3
  turns:
  - role: user
    time: 09:00
    text: 哎，我高中那会儿成绩其实一直挺稳的，年级前几名那种，但高三那年真的不一样了。
  - role: assistant
    time: 09:02
    text: 嗯，我记得你高一的时候成绩曲线特别漂亮，我帮你把高中三年的成绩变化梳理成了一条曲线，看着就很有成就感。
  - role: user
    time: 09:05
    text: 哈哈，高一确实轻松，但高三为了高考，我天天熬夜刷题，那阵子真是拼了命。
  - role: assistant
    time: 09:07
    text: 对，我帮你回忆过，你高考前那段压力的来源，其实就是你自己给自己定的目标太高了，加上睡眠不足。
  - role: user
    time: 09:10
    text: 是啊，高考前我特别紧张，手心冒汗，晚上都睡不着，现在想想还挺后怕的。
  temporal: false
- id: d02
  scene: 学生时代/高中
  covers:
  - uh4
  - ah3
  - th3
  - uh5
  - ah4
  - th4
  - uh6
  turns:
  - role: user
    time: 09:00
    text: 哎，昨晚翻到高中照片，突然好怀念啊。高考前那阵子，我每天晚自习后都去操场跑几圈，跑完脑子特别清醒。
  - role: assistant
    time: 09:02
    text: 哈哈，我懂那种感觉。对了，你之前不是老提你同桌吗？你们那时候关系铁得跟亲兄弟似的，现在还有联系吗？
  - role: user
    time: 09:04
    text: 有啊，不过联系少了。其实高考那几天，我俩还互相打气来着，他紧张得不行，我反而挺淡定。对了，我那时候还暗恋隔壁班一个女生，每次跑完步路过她们班窗户，都会偷偷瞄一眼。
  - role: assistant
    time: 09:06
    text: 哈哈，青春啊！我帮你把高中到大学的时间线捋了一下，发现你高考前和高考那几天状态差别挺大的。要不我也给你整理几条缓解学习焦虑的建议？你那时候要是用上，说不定能更稳。
  - role: user
    time: 09:08
    text: 行啊，你发我看看。其实现在想想，高考前那会儿焦虑归焦虑，但每天跑步真的帮我撑过来了。
  - role: assistant
    time: 09:10
    text: 对，运动就是最好的解压阀。我给你的建议里第一条就是保持规律运动，第二条是考前别熬夜，第三条是深呼吸……反正都是你亲测有效的方法，我帮你归纳成清单了。
  temporal: false
- id: d03
  scene: 学生时代/高中
  covers:
  - uh7
  - ah5
  - th5
  - uh8
  - ah6
  - th6
  - uh9
  turns:
  - role: user
    time: 09:00
    text: 哎，说起来我高考那几天真是惨，整宿整宿睡不着，脑子跟放电影似的。
  - role: assistant
    time: 09:02
    text: 哈哈，我懂那种感觉。不过你之前不是跟我说过，高二那会儿你天天打游戏，作业全靠抄，我还帮你回忆过那段“光辉岁月”呢。
  - role: user
    time: 09:05
    text: 可不是嘛，高一我还拿过数学竞赛校三等奖呢，结果高二一放飞，全废了。最后高考完，也就考了个普通大专。
  - role: assistant
    time: 09:07
    text: 但你看，后来你工作也挺好的。我帮你把高中到工作的成长脉络捋了一遍，其实那会儿的弯路反而让你现在更踏实。
  - role: user
    time: 09:10
    text: 也是，高中时觉得天塌了的事，现在想想也就那样。不过失眠那几天是真难熬，现在偶尔还会做噩梦梦到高考。
  - role: assistant
    time: 09:12
    text: 没事，梦到就梦到呗。反正你现在已经走出来了，我还帮你把那段经历整理成了一条成长线，以后回头看都是素材。
  temporal: false
- id: d04
  scene: 学生时代/高中
  covers:
  - uh10
  - th7
  - uh11
  - th8
  - uh12
  - uh13
  - uh14
  turns:
  - role: user
    time: 09:00
    text: 哎，说起高中，我高二那会儿真是疯了，天天打游戏，成绩直接掉到班级中下游，我妈都快急死了。
  - role: assistant
    time: 09:02
    text: 哈哈，我懂，我那时候也爱玩。不过你提到晚自习，我印象里你好像说过那会儿觉得特别安静，挺享受的？
  - role: user
    time: 09:05
    text: 对，晚自习真是最安静的时光，虽然成绩烂，但每天骑车上下学，路上吹吹风，到学校门口买包辣条，就觉得挺满足的。
  - role: assistant
    time: 09:07
    text: 辣条啊，我记得你高中时老买那家小卖部的。后来高考后的暑假，你还有回去吃吗？
  - role: user
    time: 09:10
    text: 暑假回去过一次，但味道好像没以前香了。哎，反正那会儿骑车上下学，晚自习安静，辣条也香，现在想想还挺怀念的。
  - role: assistant
    time: 09:12
    text: 是啊，我帮你把这段回忆整理成一个小故事吧，就叫《高二的辣条与晚自习》，下次你翻出来看看，肯定特有感觉。
  temporal: false
- id: d05
  scene: 学生时代/高中
  covers:
  - uh15
  - uh16
  - uh17
  turns:
  - role: user
    time: 09:00
    text: 哎，我昨天翻到高中课本，突然想起我那个同桌，上课老爱传纸条，每次都被老师瞪，哈哈。
  - role: assistant
    time: 09:02
    text: 哈哈，传纸条可是学生时代标配啊。我帮你把这段回忆记下来了，还顺手给你标了个‘青春必修课’的标签，怎么样？
  - role: user
    time: 09:05
    text: 行啊，挺有意思。其实高三那年我课桌上贴满了便签，全是激励自己的话，什么‘再坚持一下’‘别怂’之类的，现在看还挺中二。
  - role: assistant
    time: 09:07
    text: 那会儿的便签可都是精神支柱啊。我帮你把那些便签内容也整理成一份‘高三能量清单’了，下次想怀旧直接翻出来看。
  - role: user
    time: 09:10
    text: 谢啦。对了，去年暑假高考完我第一次出去旅行，还特意把那些便签撕下来带了几张，结果路上全弄丢了，哈哈。
  - role: assistant
    time: 09:12
    text: 丢了也没事，记忆还在嘛。我帮你把那次旅行和便签的事串成一个小故事存好了，以后讲给朋友听绝对有画面感。
  temporal: true
- id: d06
  scene: 学生时代/大专
  covers:
  - uc1
  - ac1
  - tc1
  - uc2
  - ac2
  - tc2
  - uc3
  turns:
  - role: user
    time: 09:00
    text: 哎，我大专那会儿真是浑浑噩噩的，大一整天窝在宿舍打游戏，现在想想挺后悔的。
  - role: assistant
    time: 09:02
    text: 哈哈，谁还没个迷茫期呢。不过我记得你后来不是慢慢找到方向了吗？我帮你回顾过那段转变，其实挺关键的。
  - role: user
    time: 09:05
    text: 对，大二下学期的时候，我偶然接触了编程，突然觉得有点意思。不过真正开始行动，还是因为室友拉我参加了个社团。
  - role: assistant
    time: 09:07
    text: 对对，就是那次社团活动之后，你开始自学编程了。我还帮你整理过一套学习路线，从基础语法到项目实战，你后来不是学得挺带劲嘛。
  - role: user
    time: 09:10
    text: 是啊，要不是大二那次被室友拽去社团，估计我现在还在打游戏呢。你当时给我列的那个路线，我到现在还留着。
  - role: assistant
    time: 09:12
    text: 那必须的，你后来能转行成功，那套路线也算立了功。不过关键还是你自己抓住了大二下学期那个转折点。
  temporal: false
- id: d07
  scene: 学生时代/大专
  covers:
  - uc4
  - ac3
  - tc3
  - uc5
  - ac4
  - tc4
  - uc6
  turns:
  - role: user
    time: 09:00
    text: 哎，其实我大专那会儿特别迷茫，完全不知道以后干嘛，整天混日子。
  - role: assistant
    time: 09:02
    text: 嗯，我帮你梳理过你的职业起点时间线，发现你真正开始系统自学编程是在大三，对吧？那时候好像突然开窍了。
  - role: user
    time: 09:05
    text: 对，大三那年我下了狠心，每天泡图书馆看网课，总算把基础补上了。不过大一挂科那事儿，现在想起来还挺丢人的。
  - role: assistant
    time: 09:07
    text: 哈哈，我帮你复盘过大一挂科的原因，其实就是没找到方向，加上课程太枯燥。但你看，毕业前你居然拿到了后端开发的offer，挺厉害的。
  - role: user
    time: 09:10
    text: 毕业前那阵子我投了好多简历，最后能拿到offer真是运气。现在想想，要是大三没开始自学，估计还在迷茫呢。
  - role: assistant
    time: 09:12
    text: 所以啊，迷茫不可怕，关键是大三那个转折点你抓住了。我帮你把这段经历整理成时间线，以后面试还能当故事讲呢。
  temporal: false
- id: d08
  scene: 学生时代/大专
  covers:
  - uc7
  - ac5
  - tc5
  - uc8
  - ac6
  - tc6
  - uc9
  turns:
  - role: user
    time: 09:00
    text: 哎，我大专那会儿跟室友关系真的超好，现在想起来还挺怀念的。
  - role: assistant
    time: 09:02
    text: 是吧，那会儿你们一起参加编程社团的培训课，我记得你还跟我提过，后来我帮你把社团活动里的收获都整理成了一份清单，方便你写简历用。
  - role: user
    time: 09:05
    text: 对对，大二那会儿确实挺忙的，社团培训加上课，不过现在觉得挺值的。毕业前我还去参加了学校的招聘会，人超多。
  - role: assistant
    time: 09:07
    text: 嗯，招聘会那阵子你挺焦虑的，后来我帮你规划了大三的求职准备，分了好几个阶段，你照着做就顺多了。
  - role: user
    time: 09:10
    text: 哈哈，多亏你那时候帮我理思路，不然我肯定手忙脚乱。现在想想，大专时那些经历真的帮了不少忙。
  - role: assistant
    time: 09:12
    text: 是啊，你室友关系好，社团培训也扎实，招聘会也去了，每一步都没白走。现在回头看，那两年挺充实的。
  temporal: false
- id: d09
  scene: 学生时代/大专
  covers:
  - uc10
  - tc7
  - uc11
  - uc12
  - uc13
  - uc14
  - uc15
  turns:
  - role: user
    time: 09:00
    text: 哎，其实我大一那会儿特别迷茫，整天逃课，期末还挂了一科，当时真觉得自己啥都不行。
  - role: assistant
    time: 09:02
    text: 听你这么说，我倒是想起你之前提过，后来是靠编程找到方向的？我帮你把这段经历捋一捋，感觉挺励志的。
  - role: user
    time: 09:05
    text: 对，大二开始我就规律地上自习了，慢慢就找到感觉了。不过说实话，那会儿在食堂最爱吃的还是麻辣香锅，每次自习完就去点一份。
  - role: assistant
    time: 09:07
    text: 哈哈，麻辣香锅确实是学生时代的灵魂。到了大三，你好像经常熬夜写代码？我记得你跟我说过，那会儿宿舍灯都关了，就你电脑屏幕亮着。
  - role: user
    time: 09:10
    text: 可不是嘛，大三那会儿写代码上瘾，越写越有劲。后来校招的时候，我就靠着这些项目经验，顺利拿到offer了，总算从迷茫里走出来了。
  - role: assistant
    time: 09:12
    text: 真好，我帮你把这段经历整理成时间线了——大一逃课挂科，大二自习加麻辣香锅，大三熬夜写代码，最后校招上岸。你看，每一步都没白走。
  temporal: false
- id: d10
  scene: 学生时代/大专
  covers:
  - uc16
  - uc17
  - uc18
  turns:
  - role: user
    time: 09:00
    text: 哎，昨天整理旧手机，翻到毕业那会儿的照片，突然有点感慨。当时跟室友们说好常联系，结果现在也就偶尔群里冒个泡。
  - role: assistant
    time: 09:02
    text: 哈哈，毕业季都这样。不过你当时不是在校招会上投了一堆简历嘛，忙起来自然就顾不上伤感了。我记得你好像还跟我提过，投了得有二十多家？
  - role: user
    time: 09:05
    text: 可不是嘛，那阵子天天跑宣讲会，简历改到吐。其实我大专那会儿还加过编程学习群，群里几个哥们儿现在反而聊得比室友还勤，你说怪不怪。
  - role: assistant
    time: 09:07
    text: 这很正常啊，兴趣圈子反而更容易维持。对了，你上周不是还跟我说想整理一下毕业照和群聊记录吗？我帮你建了个相册分类，回头你把照片传给我，我按时间排好。
  - role: user
    time: 09:10
    text: 行啊，那麻烦你了。其实去年暑假我回过一次学校，宿舍楼都翻新了，但一进门还是想起当年一起打游戏到半夜的日子。
  - role: assistant
    time: 09:12
    text: 嗯，回忆这东西啊，越具体越戳人。我帮你把那些照片和聊天截图都标好日期，以后想翻随时能翻到。
  temporal: true
- id: d11
  scene: 工作开发
  covers:
  - uw1
  - aw1
  - tw1
  - uw2
  - aw2
  - tw2
  - uw3
  turns:
  - role: user
    time: 09:00
    text: 哎，我这周项目赶得不行，每天加班到十一点，昨晚周一晚上还临时接了个紧急需求，真是头大。
  - role: assistant
    time: 09:05
    text: 辛苦辛苦！我帮你把下周的排期整理成清单了，还标了优先级，你抽空看一眼。对了，周三的需求评审会我也给你标出来了，别漏了。
  - role: user
    time: 09:10
    text: 谢啦！不过周二白天我可能还得抽空改那个紧急需求，你清单里周二那块儿帮我留点缓冲时间呗？
  - role: assistant
    time: 09:12
    text: 没问题，我这就把周二白天的任务往后挪一挪，给你留出两小时空档。另外周一晚上那个紧急需求，我把它标成最高优先级了，你记得先处理它。
  - role: user
    time: 09:15
    text: 行，反正这周就靠你这清单活了。等周三评审会开完，我再跟你同步下后续安排。
  temporal: true
- id: d12
  scene: 工作开发
  covers:
  - uw4
  - aw3
  - tw3
  - uw5
  - aw4
  - tw4
  - uw6
  turns:
  - role: user
    time: 09:00
    text: 哎，周三凌晨那会儿项目总算上线了，结果没撑过俩小时就炸了个P0，我整个人都懵了。
  - role: assistant
    time: 09:05
    text: 我看到了，当时你急得不行。我帮你梳理了一份P0故障排查要点，从日志入口到依赖服务都列了，你后来用上了吗？
  - role: user
    time: 09:12
    text: 用上了，周四深夜我通宵定位，最后发现是个缓存键冲突，修完都快天亮了。哎，那会儿真怕又出幺蛾子。
  - role: assistant
    time: 09:20
    text: 辛苦辛苦。其实我周三下午顺手用Python写了个自动拆分任务的脚本，把排查步骤拆成小任务，你周四深夜能那么快定位，多少也靠它帮你理清了顺序。
