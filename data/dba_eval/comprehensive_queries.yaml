# 综合能力测评 · 查询集（v3 陈述触发式）
#
# 参照三套数据集的能力融合设计：
#   · LiFEMem 七类：single_fact / preference / multi_hop / knowledge_update /
#                    temporal / cross_scene / abstention
#   · agent_user 双主体：助手自身经历/行为、混合记忆（用户+助手共同卷入）
#   · 时序专项：事件时间线重建（跨期 高中→大专→工作 + 期内细时间）
#
# ⚠️ 遵循 0818 §3.4「陈述触发式范式（v3）」：查询为【用户第一人称倾诉/陈述】，而非问答。
#   用户不会对 LLM 提问"他 XX 怎么样"，而是在对话中自然向 LLM 倾诉/陈述（如
#   "最近项目排得太满了，天天加班……"）。这样才贴合情感陪伴场景，且能检验系统的
#   目的推断（infer_purpose）与联想检索。
#
# 每个 query 字段：
#   - id         查询 id
#   - category   能力维度（single_fact / preference / multi_hop / knowledge_update /
#                 temporal / cross_scene / assistant_behavior / mixed_memory / abstention）
#   - text       用户第一人称叙述/倾诉式语句（触发检索）
#   - purposes   目的标签（供 PAR 目的推断/反馈注入；陈述 → 检索意图的扩展方向）
#   - gold_expected  语义期望（comprehensive_gold.yaml 节点 id，非严格对齐）

queries:
  # ================= 一、单跳·事实（信息提取） =================
  - id: q01
    category: single_fact
    text: 我一直在做后端，最近压力真的有点大。
