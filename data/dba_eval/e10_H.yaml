  type: person
- id: cg5
  content: 用户大促熬夜后第二天硬拉失败，会有点沮丧，但很快又自己调整回来。
  type: emotion
- id: cg6
  content: 用户坚持健身是因为长期久坐盯后台数据，肩颈和腰都出过问题。
  type: reason
- id: cg7
  content: 用户出差去广州看工厂也会带上弹力带，晚上在酒店房间做拉伸。
  type: action
- id: cg8
  content: 用户体脂率从上个月的 21% 降到 18%，最近在控制晚上的碳水。
  type: status
- id: cg9
  content: 用户在手机备忘录里记着深蹲、硬拉、卧推每周的训练重量。
  type: thing
- id: cg10
  content: 用户的私教阿杰给他排了四分化训练计划，还盯着他每天吃够蛋白质。
  type: person
- id: cg11
  content: 用户练完腿走出健身房的那十分钟，是一天里最放松的时候。
  type: emotion
- id: cg12
  content: 用户上周六早上约了体检，顺便让医生看看健身时扭到的右肩。
  type: action
- id: cg13
  content: 用户把健身当成对冲熬夜和应酬的手段，怕三十岁以后身体跟不上订单节奏。
  type: reason
- id: cg14
  content: 用户最近连续三周保持每周四练，是今年坚持得最久的一次。
  type: status
- id: cg15
  content: 用户购物车里躺着一双深蹲鞋和一条举重腰带，打算等 618 打折再下单。
  type: thing
- id: cv1
  content: 用户每晚处理完欧洲站的订单邮件，会开一局《英雄联盟》放松。
  type: action
- id: cv2
  content: 用户原来的机械键盘是青轴，室友嫌吵，他只好换成静音红轴。
  type: thing
- id: cv3
  content: 用户的固定车队是大学室友老周和两个做独立站的同行，周末晚上一起开黑。
  type: person
- id: cv4
  content: 用户目前排位卡在黄金一段，已经三周没上去了。
  type: status
- id: cv5
  content: 用户连输三把之后会有点上头，但会强迫自己关掉电脑去洗澡。
  type: emotion
- id: cv6
  content: 用户打游戏主要是为了跟分散在各地的老朋友保持联系。
  type: reason
- id: cv7
  content: 用户上个月趁 Steam 夏促买了个开放世界游戏，结果到现在只玩了四小时。
  type: action
- id: cv8
  content: 用户的游戏本一开黑风扇就狂转，他打算换一台散热好点的。
  type: thing
- id: cv9
  content: 用户公司新来的实习生小林也玩同一款游戏，午休时两人聊了两句出装。
  type: person
- id: cv10
  content: 用户在游戏里是个不爱说话的人，语音里基本只报点和说「稳一点」。
  type: status
- id: cv11
  content: 用户上周日打到凌晨三点，第二天盯物流异常时眼睛都是酸的。
  type: action
- id: cv12
  content: 用户第一次单人吃鸡那晚特别兴奋，还截图发到了车队群里。
  type: emotion
- id: cv13
  content: 用户选游戏更偏好能随时暂停的单机，因为随时可能被客户的消息打断。
  type: reason
- id: cv14
  content: 用户的 Steam 库里有六十多个游戏，真正通关的不到十个。
  type: thing
- id: cv15
  content: 用户给自己定的游戏时间是晚上十点半到十二点，之后必须睡觉，保证第二天七点起床跑步。
  type: action
- id: cs1
  content: 用户上周六去南山参加了一场跨境电商卖家线下沙龙，带了一整盒名片，回来只加了三个人的微信。
  type: action
- id: cs2
  content: 用户在同城沙龙上认识了做亚马逊家居类目的老陈，两人约好下个月一起拼柜走海运。
  type: person
- id: cs3
  content: 用户对深圳这种“见面先问做什么类目”的社交氛围已经习惯，甚至觉得比老家饭局轻松。
  type: emotion
- id: cs4
  content: 用户手机里存着五个深圳本地的外贸交流群，每天早上先刷一遍群消息，比刷朋友圈还早。
  type: thing
- id: cs5
  content: 用户愿意花周末时间去参加行业聚会，是因为想找一条靠谱的东南亚物流渠道。
  type: reason
- id: cs6
  content: 用户是几个跨境卖家群里的活跃分子，常被新人私信问选品和广告投放的问题。
  type: status
- id: cs7
  content: 用户上周四下班后去福田打了两个小时羽毛球，是公司同事组的局。
  type: action
- id: cs8
  content: 用户的健身搭子阿凯在宝安做货代，两人练完常在楼下吃潮汕牛肉火锅。
  type: person
- id: cs9
  content: 用户每次在深圳湾夜跑看到对岸的灯光，会觉得这座城市虽然累，但待着挺带劲。
  type: emotion
- id: cs10
  content: 用户周末约了游戏群里的朋友开黑，五个人里有三个是同行，打到凌晨一点才散。
  type: action
- id: cs11
  content: 用户手机日历上标着下周三的深圳跨境电商展，门票已经领好了。
  type: thing
- id: cs12
  content: 用户把社交圈主要放在同行和健身房里，是因为工作作息不固定，很难维系别的圈子。
  type: reason
- id: cs13
  content: 用户单身，被家里催过几次，但他觉得现在这个节奏谈恋爱对人不负责。
  type: status
- id: cs14
  content: 用户上个月参加了一次同城桌游局，全程聊的都是海外仓和清关，玩到一半还在回客户消息。
  type: action
- id: cs15
  content: 用户在热闹的饭局散场后走回地铁站时，偶尔会有点空落落的感觉。
  type: emotion
- id: cm1
  content: 用户在宝安租了一间四十平的一居室，月租四千二，骑车到公司二十分钟。
  type: status
- id: cm2
  content: 用户每天早上七点半起床，先看一遍欧美站的订单和差评再去洗漱。
  type: action
- id: cm3
  content: 用户冰箱里常年备着鸡胸肉、鸡蛋和速冻水饺，只有周末才正经做一顿饭。
  type: thing
- id: cm4
  content: 用户周三晚上固定去楼下健身房练背，练完在便利店买一瓶无糖蛋白饮。
  type: action
- id: cm5
  content: 用户对深圳回南天的潮湿很烦躁，衣柜里塞了四个除湿盒。
  type: emotion
- id: cm6
  content: 用户的房东是个本地阿姨，热水器坏过一次，打电话当天就带师傅上门了。
  type: person
- id: cm7
  content: 用户选现在这个小区是因为离地铁近，楼下又有二十四小时便利店，赶时差开会方便。
  type: reason
- id: cm8
  content: 用户上个月把阳台收拾出来放了张折叠桌，晚上在那里回邮件吹风。
  type: action
- id: cm9
  content: 用户手机里设了三个闹钟，分别对应美国站、欧洲站和东南亚站的上班时间。
  type: thing
- id: cm10
  content: 用户已经连续三个月没有休过完整的双休，周末常要盯着促销活动。
  type: status
- id: cm11
  content: 用户周日下午会骑车去海上世界那边转一圈，顺便在超市补一周的菜。
  type: action
- id: cm12
  content: 用户收到第一笔十万美金的大单那天，一个人在出租屋里点了份烧烤庆祝。
  type: emotion
- id: cm13
  content: 用户的电脑旁常年放着一瓶褪黑素和一盒膏药，那是熬夜和久坐的代价。
  type: thing
- id: cm14
  content: 用户坚持健身是因为长期坐着盯后台数据，腰和颈椎都出过问题。
  type: reason
- id: cm15
  content: 用户的对门邻居也是做跨境的年轻人，两人偶尔在电梯里交流哪家快递便宜。
  type: person
