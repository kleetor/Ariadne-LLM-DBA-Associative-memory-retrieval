- id: q14
  category: 归属·新人
  query: 小李是什么时候加入的？他做过哪些辅助性工作？
  gold_facts: [第一次参加评审, 改动记录, 周报]

- id: q9
  category: 无解答
  query: 明天北京天气怎么样，需要带伞吗？
  gold_facts: []
  expect_no_answer: true

- id: q15
  category: 无解答
  query: 我的车险什么时候到期，续保要花多少钱？
  gold_facts: []
  expect_no_answer: true
