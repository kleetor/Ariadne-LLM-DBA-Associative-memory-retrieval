- id: q5
  category: 日常·健康
  query: 老周身体上有什么情况？医生给了什么建议，他后来做了什么调整？
  gold_facts: [脂肪肝, 乌龙茶, 夜宵]

- id: q6
  category: 复杂人称
  query: 视觉稿最后要谁签字才能定？
  gold_facts: [设计总监, 陈哲]

- id: q7
  category: 工作·要求
  query: 客户对视觉稿提了什么要求？
  gold_facts: [深绿, 主色]

- id: q8
  category: 时序·社交
  query: 这周六大家都有什么安排？
  gold_facts: [友谊赛, 看展]

- id: q10
  category: 日常·归属
  query: 谁养了宠物？那只宠物有什么习惯？
  gold_facts: [橘猫, 五点半, 起床]

- id: q11
  category: 工作·进度
  query: A 方案的接口原本什么时候提测？后来为什么推迟？
  gold_facts: [周三, 提测, 联调]

- id: q12
  category: 复杂人称·关系
  query: 阿哲周末的安排和谁有关？
  gold_facts: [小雅, 看展]

- id: q13
  category: 工作·风险
  query: A 方案的上线时间定在哪天？老周怎么记录风险？
