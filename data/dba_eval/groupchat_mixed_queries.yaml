# 群聊混合场景 · 查询集（ALM vs MCP e2e 对比用）
#
# gold_facts：该查询在**检索结果**中应出现的关键片段（内容词，非完整句）。
#   比对前会先去掉空白与标点再判子串，因此大小写与空格不影响；取词以"抽取后
#   仍会保留的实词"为准（颜色名、数字日期、动作名词），避免因 LLM 改写而误判。
#   用「命中数 / 总数」作为两侧可比的量化指标。
#
# 规模：13 条可判定查询，gold_facts 合计 **34 项**（样本量足以看出方向性差异）。
#   脚本会额外报告"两侧都没命中"的 fact —— 那通常意味着抽取阶段把它丢了，
#   或该 fact 设计得过严，需人工核对，不该算作某一侧的失败。
#
# expect_no_answer：库中确实没有对应记忆的查询，用于观察两侧的弃权行为差异
#   （ALM 有 ALM_ABSTAIN_COS 弃权闸门，MCP 没有该机制）。

- id: q1
  category: 归属·工作
  query: 阿哲最近在忙什么？
  gold_facts: [主色, 通宵, 9月8日, 最终稿]

- id: q2
  category: 时序·工作
  query: 上周三的需求评审会定了什么？
  gold_facts: [先做A方案, B方案放二期]

- id: q3
  category: 归属·对比
  query: 小林和老周这段时间各自在忙什么？
  gold_facts: [接口, 排期]

- id: q4
  category: 日常·归属
  query: 谁最近开始运动了？做的什么运动，在哪儿？
