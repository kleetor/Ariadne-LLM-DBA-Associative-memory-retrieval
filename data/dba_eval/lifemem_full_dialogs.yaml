dialogs:
- id: d01
  scene: 学生时代·高中
  covers:
  - h0
  - h1
  - h10
  - h11
  - h12
  - h13
  - h14
  turns:
  - role: user
    time: 09:00
    text: 哎，你知道吗，高一上学期那会儿我成绩还挺好的，经常能进年级前五十，那时候老师老夸我。
  - role: assistant
    time: 09:01
    text: 那后来呢？感觉你语气有点转折。
  - role: user
    time: 09:02
    text: 后来啊，高一下学期我就开始沉迷打游戏了，整天泡在网吧，作业都懒得写。
  - role: assistant
    time: 09:03
    text: 游戏这么上瘾？那学习肯定落下了吧。
  - role: user
    time: 09:04
    text: 可不是嘛，不过那时候心里其实装的不是游戏，是对苏婉婷心动。我鼓起勇气给她递了情书，没想到她居然答应了。
  - role: assistant
    time: 09:05
    text: 哇，还挺浪漫的，然后呢？
  - role: user
    time: 09:06
    text: 然后我们就老放学偷偷去天台约会，结果有天上课传纸条被老师逮到了，那叫一个尴尬。
- id: d02
  scene: 学生时代·高中
  covers:
  - h15
  - h16
  - h17
  - h18
  - h19
  - h2
  - h20
  turns:
  - role: user
    time: 09:00
    text: 哎，昨晚又没睡好，翻来覆去的，就想起高三那会儿了。其实那阵子我也老失眠，半夜睁着眼睛看天花板，压力大得喘不过气。
  - role: assistant
    time: 09:01
    text: 高三确实挺熬人的。你当时是有什么具体的事压着吗？
  - role: user
    time: 09:02
    text: 可不嘛。那时候我跟苏婉婷偷偷好上了，结果心思全飘了，成绩哗哗往下掉。老师发现后直接把我爸妈叫来，说早恋影响学习，弄得我特狼狈。
  - role: assistant
    time: 09:03
    text: 被家长知道了，那阵子肯定不好过吧。
  - role: user
    time: 09:04
    text: 何止不好过……我妈那眼神我到现在都记得。他们其实特看重我，家里条件也紧，就指望我考个好大学。我哪敢说成绩下滑是因为恋爱啊，只能硬扛着，天天装没事。
  - role: assistant
    time: 09:05
    text: 憋着不说，一个人扛，难怪晚上睡不着。
  - role: user
    time: 09:06
    text: 对啊，反正后来我也就收了心，不敢再想了。结果你猜怎么着？高考前没几天，苏婉婷突然跟我说分手，我整个人都懵了，那滋味儿……哎，算了，都过去了。
- id: d03
  scene: 学生时代·高中
  covers:
  - h21
  - h22
  - h23
  - h24
  - h25
  - h26
  - h27
  turns:
  - role: user
    time: 09:00
    text: 哎，说到高中，其实我那时候挺惨的。分手之后整个人都垮了，情绪跌到谷底，感觉啥都没意思。
  - role: assistant
    time: 09:01
    text: 那段时间肯定很难熬吧，后来怎么撑过来的？
  - role: user
    time: 09:02
    text: 就硬撑呗，带着那种低落的心情进了高考考场，结果可想而知，考砸了，只上了一所普通大专。不过我也认了，反正当时选理科也是自己决定的，怨不得别人。
  - role: assistant
    time: 09:03
    text: 理科其实也挺好的啊，你当时数学应该不差吧？
  - role: user
    time: 09:04
    text: 哈哈，高一拿过数学竞赛校三等奖呢，还帮同桌林晓雨辅导过数学。不过说实话，我印象最深的还是晚自习，那会儿全班都安静下来，就我一个人在那儿发呆，反而是整个高中最舒服的时刻。
- id: d04
  scene: 学生时代·高中
  covers:
  - h28
  - h29
  - h3
  - h30
  - h31
  - h32
  - h33
  turns:
  - role: user
    time: 09:00
    text: 哎，说到高中，我现在还记得那时候最怕周一的数学考试，每次周日晚上就开始心慌。
  - role: assistant
    time: 09:01
    text: 哈哈，周一考试确实挺折磨人的，那你平时怎么缓解啊？
  - role: user
    time: 09:02
    text: 就靠去学校门口小卖部买包辣条，边嚼边背公式，感觉辣得清醒点。不过高二那会儿成绩跌到班级中下游，其实挺焦虑的。
  - role: assistant
    time: 09:03
    text: 那时候压力大，后来怎么调整过来的？
  - role: user
    time: 09:04
    text: 后来高三就在课桌上贴满激励自己的便签，天天看，还有同桌一起熬。我俩经常共用一个耳机听歌，她叫苏婉婷，特爱在课本上画小花，现在想想挺怀念的。毕业后大家各奔东西，联系渐渐少了，也就偶尔翻翻旧照片。
- id: d05
  scene: 学生时代·高中
  covers:
  - h34
  - h4
  - h5
  - h6
  - h7
  - h8
  - h9
  turns:
  - role: user
    time: 09:00
    text: 哎，你知道吗，我到现在还记得高考前那最后一节晚自习，全班那叫一个安静啊，连笔掉地上都听得见。
  - role: assistant
    time: 09:01
    text: 哈哈，那种紧张又有点舍不得的感觉吧？你那时候坐你旁边的是谁来着？
  - role: user
    time: 09:02
    text: 我同桌林晓雨啊，扎个马尾，一笑俩酒窝。平时我们老传纸条、偷偷打闹，就那天也特别老实，连纸条都不敢传了。
  - role: assistant
    time: 09:03
    text: 传纸条被老师抓过没？你们还挺会玩儿的。
  - role: user
    time: 09:04
    text: 被抓过几回呗，不过反正我死党陈浩更夸张，戴个眼镜话痨一个，课间老跟我打打闹闹，走廊上都能追着跑。他还常来我家写作业，写完就赖着不走聊天。
  - role: assistant
    time: 09:05
    text: 那你们三个关系挺铁啊，陈浩现在还有联系吗？
  - role: user
    time: 09:06
    text: 有倒是有，就是见得少了。对了，那时候还有个女生苏婉婷，长发爱穿白裙子，笑起来眼睛弯弯的，我那时候偷偷觉得她特别好看。
- id: d06
  scene: 学生时代·大专转码
  covers:
  - c0
  - c1
  - c10
  - c11
  - c12
  - c13
  - c14
  turns:
  - role: user
    time: 09:00
    text: 哎，说起我那大专，其实挺普通的，学的计算机网络，但大一那会儿我真是浑，课都不怎么上，天天在宿舍躺着。
  - role: assistant
    time: 09:01
    text: 哈哈，那后来怎么转变的？感觉你现在挺拼的。
  - role: user
    time: 09:02
    text: 就突然有一天觉得不行了，反正也没人管，我就自己每天看视频课程、刷题到深夜，那阵子真跟魔怔了一样。宿舍在六楼，晚上饿了就下楼买麻辣香锅，还挺好吃的，就当犒劳自己。
  - role: assistant
    time: 09:03
    text: 这么拼，效果应该不错吧？
  - role: user
    time: 09:04
    text: 还行，毕业前还真让我拿到了个后端开发的offer。不过我那室友更牛，他本来也跟我一起混，后来居然转行去做运维了，现在混得也不错。
  - role: assistant
    time: 09:05
    text: 那挺有意思的，你们算是互相激励了？
  - role: user
    time: 09:06
    text: 差不多吧，反正那时候我特迷茫，经常一个人去操场跑圈，跑着跑着就觉得，路还是得自己走出来。现在想想，还挺感谢那会儿的自己。
- id: d07
  scene: 学生时代·大专转码
  covers:
  - c15
  - c16
  - c17
  - c2
  - c3
  - c4
  - c5
  turns:
  - role: user
    time: 09:00
    text: 哎，其实我大一那会儿特颓废，天天打游戏，挂了好几科，那阵子真觉得人生没方向。
  - role: assistant
    time: 09:01
    text: 听起来挺难熬的，后来呢？
  - role: user
    time: 09:02
    text: 后来室友硬拉我去参加编程社团，我一开始挺不情愿的，但去了之后第一次动手写代码，突然就有点感觉了。
  - role: assistant
    time: 09:03
    text: 那算是转折点了吧？
  - role: user
    time: 09:04
    text: 对，大二有天我忽然想通了，不想再混日子了，就认真学起来。毕业旅行我们还去了西藏，结果高原反应让我在拉萨头疼了一整天，哈哈。
  - role: assistant
    time: 09:05
    text: 哈哈，那趟旅行也算难忘。不过现在回头看，那段经历挺值的。
- id: d08
  scene: 学生时代·大专转码
  covers:
  - c6
  - c7
  - c8
  - c9
  turns:
  - role: user
    time: 09:00
    text: 哎，说起来挺有意思的，我大二那会儿突然对编程有点上头，也不知道咋回事，就想去试试。
  - role: assistant
    time: 09:01
    text: 哈哈，上头的感觉我懂，那后来呢？
  - role: user
    time: 09:02
    text: 后来我就规律地去自习室自学，反正也没人逼我，就是自己想去，天天泡那儿。
  - role: assistant
    time: 09:03
    text: 坚持下来不容易吧？
  - role: user
    time: 09:04
    text: 其实还行，我还用Python写了个小工具，就是爬天气的那种，挺简陋的，但自己跑通那会儿特别开心。
  - role: assistant
    time: 09:05
    text: 那这算是个小成就了，后来有继续深入吗？
  - role: user
    time: 09:06
    text: 嗯，大三我就认真了，决定自学编程转行，反正也不怕晚，就硬着头皮往前走了。
- id: d09
  scene: 学生时代·学习
  covers:
  - ln0
  - ln1
  - ln10
  - ln11
  - ln12
  - ln13
  - ln14
  turns:
  - role: user
    time: 09:00
    text: 哎，最近一直在纠结转行的事，真的受够现在这份工作了，天天加班工资也不涨，感觉没什么前途。
  - role: assistant
    time: 09:01
    text: 嗯，转行可不是小事，你心里有方向了吗？
  - role: user
    time: 09:03
    text: 有啊，就想往AI那边靠。反正现在也学了不少，GitHub上还放了好几个项目，虽然不咋地吧，但好歹算个开始。
  - role: assistant
    time: 09:04
    text: 那挺好啊，有人一起交流吗？一个人学容易闷。
  - role: user
    time: 09:06
    text: 有有有，群里有个大神特别热心，老帮我解答问题，另外还有几个同样在转行的朋友，我们经常互发面经，互相打气。其实昨天刚跑通第一个分类器，激动得不行，感觉总算有点成果了。
  - role: assistant
    time: 09:07
    text: 哈哈，能想象那种开心。不过应该也有卡住的时候吧？
  - role: user
    time: 09:09
    text: 那当然，算法题做不出来的时候真的巨挫败，有时候盯着屏幕半小时都动不了。但想想还是得咬牙继续，毕竟路是自己选的。
- id: d10
  scene: 学生时代·学习
  covers:
  - ln15
  - ln16
  - ln17
  - ln18
  - ln19
  - ln2
  - ln20
  turns:
  - role: user
    time: 09:00
    text: 哎，我最近不是一直在折腾转行嘛，本来以为挺容易的，结果发现门槛比想象中高多了。
  - role: assistant
    time: 09:01
    text: 是啊，转行确实不容易，不过你之前不是还报了不少课吗？
  - role: user
    time: 09:02
    text: 对，朋友跟我说AI行业前景特别好，我就去听了吴恩达的课，真的讲得特别通俗易懂，我一个零基础的居然听懂了。
  - role: assistant
    time: 09:03
    text: 那挺好的，是不是还拿了证书？
  - role: user
    time: 09:04
    text: 嗯，Coursera上的课程证书拿到了，我还发到LinkedIn上了，反正也是给自己加个分嘛。
  - role: assistant
    time: 09:05
    text: 看来你是真认真了，后面还有别的计划吗？
  - role: user
    time: 09:06
    text: 又买了一门李沐的动手学深度学习，结果发现数学要求比较高，唉，一下子有点头大，感觉还得补补数学。
- id: d11
  scene: 学生时代·学习
  covers:
  - ln21
  - ln22
  - ln23
  - ln24
  - ln25
  - ln26
  - ln27
  turns:
  - role: user
    time: 09:00
    text: 哎，昨天装CUDA和PyTorch真折腾死我了，搞了一整天，最后才发现是驱动版本不对。
  - role: assistant
    time: 09:01
    text: 哈哈，装环境确实容易卡住，你那显卡是啥型号来着？
  - role: user
    time: 09:02
    text: RXT 3060，显存12G，跑起来倒是挺快的，第一个模型训练花了一个小时吧。
  - role: assistant
    time: 09:03
    text: 那结果怎么样？
  - role: user
    time: 09:04
    text: 刚开始准确率只有72%，说实话有点不满意，然后我调参调了很久，才慢慢弄到85%。
  - role: assistant
    time: 09:05
    text: 85%其实也还行吧，不过调参确实费劲。
  - role: user
    time: 09:06
    text: 是啊，但后来我发现数据预处理比调参重要多了，清洗和归一化做好，效果提升特别明显。最近还看了一篇关于Transformer的论文，感觉思路又不一样了。
- id: d12
  scene: 学生时代·学习
  covers:
  - ln28
  - ln29
  - ln3
  - ln30
  - ln31
  - ln32
  - ln33
  turns:
