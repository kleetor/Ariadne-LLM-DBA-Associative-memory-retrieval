# DBA 抽取评测 · 对话语料（LiFEMem 子集）
#
# 从 LiFEMem 5 个场景抽取 100 节点（工作 w0-w19 / 健康 he0-he19 /
# 社交 so0-so19 / 情绪 e0-e19 / 学生时代 h0-h19），按场景还原为 15 批
# 多轮对话。对话口语化改写（不照念节点 content），含指代/省略/寒暄噪声，
# 用于评测 DBA 的抽取、指代消解、省略补全与噪声过滤能力。
#
# 每批 turns 由评测脚本拼接为 DBA maintain() 的 conversation 文本。

