# 情感陪伴冒烟数据集 ——「原始对话文本」作为记忆写入来源
#
# 说明：本数据集是记忆系统（Ariadne / Mem0 / Graphiti）的**统一输入**。
#   - conversation：原始对话文本（含角色与时间戳），各系统据此写入/抽取记忆；
#     三系统拿到的是同一条原始对话，而非事后的原子化事实碎片。
#   - queries：评测倾诉（陪伴系统需要回应/检索的触发点）。
#   - 场景：情感陪伴（系统建立基石）。

dataset: companionship_smoke
version: raw-v1
scenario: emotional_companion
note: >-
  原始对话文本输入。Ariadne 走 tool-calling 按需 search/add；Mem0/Graphiti 每轮
  写入原文并抽取。三系统共享同一原始对话，确保公平。

# ---- 原始对话文本（记忆写入来源）----
# 多轮：讲述用户近况（工作压力 → 健康 → 情绪），含少量助手回应以贴近真实对话。
conversation:
  - id: c1
    role: user
    ts: "2026-08-15 21:30"
    text: "最近项目排得太满了，天天加班到十一二点，感觉整个人都被掏空了……"
  - id: c2
    role: assistant
    ts: "2026-08-15 21:31"
    text: "听起来你最近真的被工作压得喘不过气。是项目本身的节奏问题，还是人手不太够？"
  - id: c3
    role: user
    ts: "2026-08-15 21:32"
    text: "我在一家互联网公司做后端开发，项目经常要赶进度，我们组就我和小王两个后端，加班到晚上11点是常态。"
  - id: c4
    role: user
    ts: "2026-08-15 21:33"
    text: "加班多了之后，颈椎经常酸痛，上个月体检还真查出轻度脂肪肝和胆固醇偏高，我有点慌。"
  - id: c5
    role: assistant
    ts: "2026-08-15 21:34"
    text: "体检结果确实会让人担心，但既然已经发现了，说明你开始重视身体了，这是好事。你平时有在运动吗？"
  - id: c6
    role: user
    ts: "2026-08-15 21:35"
    text: "我每天早上会绕着小区晨跑半小时，晨跑确实能让我轻松一点。心情很差的时候，我就写在日记里倾诉。"
  - id: c7
    role: assistant
    ts: "2026-08-15 21:36"
    text: "晨跑和写日记都是很好的自我照顾方式。那睡眠呢？最近睡得好吗？"
  - id: c8
    role: user
    ts: "2026-08-15 21:37"
    text: "最近总是睡不好，颈椎也难受，我是不是该抽空去体检一下？……感觉压力好大，不知道要怎么熬过这段日子。"

# ---- 评测查询（陪伴需回应的倾诉）----
queries:
  - id: q1
    scenario: work_pressure
    text: "最近项目排得太满了，天天加班到十一二点，感觉整个人都被掏空了……"
  - id: q2
    scenario: health
    text: "最近总是睡不好，颈椎也难受，我是不是该抽空去体检一下？"
  - id: q3
    scenario: emotion
    text: "感觉压力好大，不知道怎么熬过这段日子……"
