<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DBA Memory Graph Viewer</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000011; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; overflow:hidden; }
#graph-container { position:absolute; inset:0; z-index:1; }
canvas { display:block; }

/* Search bar */
#search-bar { position:fixed; top:16px; left:50%; transform:translateX(-50%); z-index:110; }
#search-bar input { width:360px; padding:8px 16px; border-radius:20px; border:1px solid rgba(255,255,255,0.12);
  background:rgba(10,14,24,0.9); color:#c8d6e5; font-size:14px; outline:none; backdrop-filter:blur(12px); }
#search-bar input::placeholder { color:rgba(255,255,255,0.3); }

/* Floating panels */
.panel { position:fixed; z-index:100; background:rgba(10,14,24,0.85); backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,0.08); border-radius:10px; padding:16px; color:#c8d6e5; font-size:13px; pointer-events:auto; }
.panel h3 { font-size:12px; text-transform:uppercase; letter-spacing:1px; color:rgba(255,255,255,0.4); margin-bottom:10px; }
.panel label { display:flex; align-items:center; gap:6px; padding:3px 0; cursor:pointer; }
.panel label:hover { color:#fff; }
.panel label input[type=checkbox] { accent-color:#5DADE2; }
.panel .divider { border-top:1px solid rgba(255,255,255,0.06); margin:8px 0; }
.panel .row { display:grid; grid-template-columns:1fr 1fr; gap:2px 8px; }
.panel button { display:block; width:100%; margin:2px 0; padding:6px; border:1px solid rgba(255,255,255,0.1); border-radius:6px;
  background:rgba(255,255,255,0.06); color:#a0b0c0; font-size:12px; cursor:pointer; text-align:center; }
.panel button:hover { background:rgba(255,255,255,0.12); color:#fff; }
.panel button.active { border-color:#5DADE2; color:#5DADE2; }

#panel-left { left:16px; top:16px; width:350px; }
#panel-right { right:16px; top:16px; width:240px; display:none; }
#panel-left .toggle-icon { display:none; }

/* Status bar */
#status-bar { position:fixed; bottom:0; left:0; right:0; z-index:100; height:32px;
  background:rgba(10,14,24,0.8); border-top:1px solid rgba(255,255,255,0.06);
  display:flex; align-items:center; justify-content:space-between; padding:0 16px; font-size:12px; color:rgba(255,255,255,0.4); }
#status-bar span { margin-right:20px; }
#status-bar .val { color:#a0b0c0; }

/* Context menu */
#ctx-menu { position:fixed; z-index:200; background:rgba(10,14,24,0.94); backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,0.1); border-radius:8px; padding:4px 0; min-width:160px; display:none; }
#ctx-menu .item { padding:6px 14px; font-size:13px; color:#c8d6e5; cursor:pointer; white-space:nowrap; }
#ctx-menu .item:hover { background:rgba(255,255,255,0.1); }
#ctx-menu .sep { border-top:1px solid rgba(255,255,255,0.06); margin:4px 0; }

/* Responsive */
@media(max-width:900px) {
  #panel-left { width:40px; overflow:hidden; }
  #panel-left h3, #panel-left label, #panel-left button, #panel-left .divider { display:none; }
  #panel-left .toggle-icon { display:block; text-align:center; font-size:18px; cursor:pointer; }
  #panel-left:hover { width:350px; }
  #panel-left:hover h3, #panel-left:hover label, #panel-left:hover button, #panel-left:hover .divider { display:block; }
  #panel-right { width:180px; font-size:11px; }
}

/* Tooltip */
#tooltip { position:fixed; z-index:150; background:rgba(0,0,0,0.85); color:#eee; padding:6px 12px;
  border-radius:6px; font-size:12px; max-width:300px; pointer-events:none; display:none; }

/* Search dropdown */
#search-dropdown { position:fixed; top:52px; left:50%; transform:translateX(-50%); z-index:111; width:360px;
  max-height:260px; overflow-y:auto; background:rgba(10,14,24,0.94); backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,0.08); border-radius:8px; display:none; }
#search-dropdown .item { padding:6px 14px; font-size:13px; color:#c8d6e5; cursor:pointer;
  border-bottom:1px solid rgba(255,255,255,0.04); display:flex; align-items:center; gap:8px; }
#search-dropdown .item:last-child { border-bottom:none; }
#search-dropdown .item:hover { background:rgba(255,255,255,0.08); }
#search-dropdown .item .dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
#search-dropdown .item .text { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#search-dropdown .item .type { font-size:10px; color:rgba(255,255,255,0.3); margin-left:auto; flex-shrink:0; }

/* CRUD Panel */
#crud-panel { position:fixed; left:370px; bottom:50px; z-index:105; width:380px; height:520px;
  background:rgba(10,14,24,0.92); backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,0.08); border-radius:10px; display:flex; flex-direction:column; overflow:hidden; }
#crud-panel .titlebar { height:36px; min-height:36px; display:flex; align-items:center; justify-content:space-between;
  padding:0 12px; cursor:move; user-select:none; border-bottom:1px solid rgba(255,255,255,0.06); }
#crud-panel .titlebar span { font-size:13px; color:#a0b0c0; }
#crud-panel .titlebar button { background:none; border:none; color:rgba(255,255,255,0.3); cursor:pointer; font-size:16px; padding:0 4px; }
#crud-panel .titlebar button:hover { color:#fff; }
#crud-panel .toolbar { padding:8px 12px; display:flex; gap:6px; flex-wrap:wrap; border-bottom:1px solid rgba(255,255,255,0.06); }
#crud-panel .toolbar button { padding:4px 10px; border:1px solid rgba(255,255,255,0.1); border-radius:5px;
  background:rgba(255,255,255,0.04); color:#a0b0c0; font-size:12px; cursor:pointer; }
#crud-panel .toolbar button:hover { background:rgba(255,255,255,0.1); color:#fff; }
#crud-panel .toolbar button.danger { border-color:rgba(231,76,60,0.3); color:#e74c3c; }
#crud-panel .toolbar input { flex:1; min-width:100px; padding:4px 8px; border:1px solid rgba(255,255,255,0.08);
  border-radius:5px; background:rgba(255,255,255,0.04); color:#c8d6e5; font-size:12px; outline:none; }
#crud-panel .toolbar input:focus { border-color:#5DADE2; }
#crud-panel .body { flex:1; overflow-y:auto; padding:0; scrollbar-width:thin; scrollbar-color:rgba(255,255,255,0.18) transparent; }
/* CRUD 控制台自定义滚动条 */
#crud-panel .body::-webkit-scrollbar { width:8px; }
#crud-panel .body::-webkit-scrollbar-track { background:transparent; }
#crud-panel .body::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.18); border-radius:4px; }
#crud-panel .body::-webkit-scrollbar-thumb:hover { background:rgba(255,255,255,0.3); }
#crud-panel .section-title { font-size:11px; text-transform:uppercase; letter-spacing:1px; color:rgba(255,255,255,0.3);
  padding:10px 12px 4px; }
#crud-panel .node-list-item { padding:6px 12px; display:flex; align-items:center; gap:8px; cursor:pointer;
  border-bottom:1px solid rgba(255,255,255,0.03); font-size:12px; color:#c8d6e5; }
#crud-panel .node-list-item:hover { background:rgba(255,255,255,0.05); }
#crud-panel .node-list-item.active { background:rgba(93,173,226,0.1); }
#crud-panel .node-list-item .dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
#crud-panel .node-list-item .content { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
#crud-panel .node-list-item .ntype { font-size:10px; color:rgba(255,255,255,0.3); flex-shrink:0; }
#crud-panel .edit-section { padding:12px; }
#crud-panel .edit-section label { display:block; font-size:11px; color:rgba(255,255,255,0.4); margin-bottom:4px; }
#crud-panel .edit-section input, #crud-panel .edit-section textarea, #crud-panel .edit-section select {

#crud-panel .edit-section input:focus, #crud-panel .edit-section textarea:focus, #crud-panel .edit-section select:focus { border-color:#5DADE2; }

#crud-panel .edit-actions { padding:0 12px 12px; display:flex; gap:6px; }
#crud-panel .edit-actions button { padding:6px 14px; border:1px solid rgba(255,255,255,0.1); border-radius:6px;
  background:rgba(255,255,255,0.06); color:#a0b0c0; font-size:12px; cursor:pointer; }
#crud-panel .edit-actions button:hover { background:rgba(255,255,255,0.12); color:#fff; }
#crud-panel .edit-actions button.primary { border-color:#5DADE2; color:#5DADE2; }
#crud-panel .edit-actions button.danger { border-color:rgba(231,76,60,0.3); color:#e74c3c; }
#crud-panel .edge-item { padding:4px 12px; display:flex; align-items:center; gap:6px; font-size:12px; color:rgba(255,255,255,0.5); }
#crud-panel .edge-item .arrow { color:rgba(255,255,255,0.2); flex-shrink:0; }

#crud-panel .edge-item .del-btn { margin-left:auto; background:none; border:none; color:rgba(255,255,255,0.2); cursor:pointer; font-size:14px; }
#crud-panel .edge-item .del-btn:hover { color:#e74c3c; }
#crud-panel .statusbar { padding:6px 12px; font-size:11px; color:rgba(255,255,255,0.3); border-top:1px solid rgba(255,255,255,0.06); }
#crud-panel .empty-state { padding:30px; text-align:center; color:rgba(255,255,255,0.2); font-size:13px; }
/* Modal overlay */
.crud-modal-overlay { position:fixed; inset:0; z-index:200; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; }
.crud-modal { background:rgba(10,14,24,0.96); backdrop-filter:blur(16px); border:1px solid rgba(255,255,255,0.1);
  border-radius:10px; padding:20px; width:360px; }
.crud-modal h3 { font-size:14px; color:#c8d6e5; margin-bottom:14px; }
.crud-modal label { display:block; font-size:11px; color:rgba(255,255,255,0.4); margin-bottom:4px; }
.crud-modal input, .crud-modal select, .crud-modal textarea { width:100%; padding:6px 10px; border:1px solid rgba(255,255,255,0.08);

.crud-modal input:focus, .crud-modal select:focus { border-color:#5DADE2; }
.crud-modal select option { background:#141c2c; color:#c8d6e5; }
.crud-modal .actions { display:flex; gap:8px; justify-content:flex-end; margin-top:8px; }
.crud-modal .actions button { padding:6px 16px; border:1px solid rgba(255,255,255,0.1); border-radius:6px;

.crud-modal .actions button:hover { background:rgba(255,255,255,0.12); color:#fff; }
.crud-modal .actions button.primary { border-color:#5DADE2; color:#5DADE2; }

/* Edge connect/delete mode */
body.edge-mode canvas { cursor:crosshair !important; }
.edge-type-select { display:flex; gap:4px; flex-wrap:wrap; padding:4px 0; }
.edge-type-select .et-opt { padding:2px 6px; border:1px solid rgba(255,255,255,0.1); border-radius:4px;
  font-size:10px; cursor:pointer; color:rgba(255,255,255,0.5); }
.edge-type-select .et-opt:hover { border-color:rgba(255,255,255,0.3); color:#fff; }
.edge-type-select .et-opt.sel { border-color:currentColor; color:#fff; }
#edge-mode-bar { position:fixed; top:56px; left:50%; transform:translateX(-50%); z-index:120;
  padding:6px 16px; border-radius:8px; font-size:13px; display:none; }
#edge-mode-bar.connect { background:rgba(39,174,96,0.3); border:1px solid #27AE60; color:#27AE60; display:block; }
#edge-mode-bar.disconnect { background:rgba(231,76,60,0.3); border:1px solid #E74C3C; color:#E74C3C; display:block; }
</style>

<script src="https://unpkg.com/three@0.148.0/build/three.min.js"></script>
<script src="https://unpkg.com/3d-force-graph@1.71.3/dist/3d-force-graph.min.js"></script>

<script>// ===== DATA =====
const FULL_DATA_STATIC = __DATA_PLACEHOLDER__;
let FULL_DATA = FULL_DATA_STATIC;
let allNodes = FULL_DATA.nodes, allLinks = FULL_DATA.links;

// 页面加载后从 API 拉取最新数据（CRUD 操作后的修改通过 API 持久化到 YAML）
async function refreshFromAPI() {
  try {
    const res = await fetch('/api/graph');
    if (res.ok) {
      const apiData = await res.json();
      if (apiData.nodes && apiData.nodes.length > 0) {
        FULL_DATA = apiData;
        allNodes = apiData.nodes;
        allLinks = apiData.links;
        if (typeof graph !== 'undefined' && graph.graphData) {
          graph.graphData({nodes: allNodes, links: allLinks});
          // 重建 nodeGroups（graphData 替换会清空 ThreeObject）
          graph.nodeThreeObject(node => createNodeObject(node));
          applyFilters();
        }
      }
    }
  } catch(e) {
    // API 不可用时使用静态数据，静默降级
  }
}
// 首次加载
refreshFromAPI();
// 定时轮询：自动同步 MCP 对 YAML 的修改
setInterval(refreshFromAPI, 15000);

// ===== CONSTANTS =====
const NODE_COLORS = { STATUS:'#5DADE2', REASON:'#E74C3C', ACTION:'#F39C12', THING:'#27AE60', PERSON:'#A569BD', EMOTION:'#E91E63' };
const EDGE_COLORS = { causal:'#E74C3C', scenario:'#27AE60', sequence:'#3498DB', preference:'#F39C12', social:'#A569BD', attribute:'#1ABC9C', temporal:'#95A5A6', taxonomic:'#7F8C8D' };
// 双向关系类型
const BIDIRECTIONAL = new Set(['scenario','social','attribute']);

// ===== FILTER STATE =====
const nodeTypeFilters = Object.fromEntries(Object.keys(NODE_COLORS).map(k=>[k,true]));
const edgeTypeFilters = Object.fromEntries(Object.keys(EDGE_COLORS).map(k=>[k,true]));
let showDeprecated = true, showForgotten = false;
let hideOrphans = false, highDegOnly = false;
let medianDegree = 0;

// ===== FOCUS STATE =====
let focusNode = null, focusNeighbors = new Set();
let selectedNode = null;
const materialMap = new Map(); // nodeId -> [material, ...]

// ===== DRAG/FIX STATE =====
const fixedNodes = new Set();
const orbitData = new Map(); // nodeId -> { satellites: [{mesh, radius, offset}], angle }

// ===== EDGE MODE STATE =====
let pendingEdgeAction = null; // { type: 'connect'|'disconnect', sourceNode, relType? }
const nodeGroups = new Map(); // nodeId -> THREE.Group

function findNodeGroup(nodeId) { return nodeGroups.get(nodeId); }

function addOrbitToGroup(group, node) {
  const orbitR = node.radius * 2.2;
  const count = 4;
  const tilt = Math.PI / 4; // 45° tilt into 3D
  // Semi-transparent ring trail (tilted into 3D)
  const ringGeo = new THREE.TorusGeometry(orbitR, 0.15, 8, 48);
  const ringMat = new THREE.MeshBasicMaterial({ color: 0xFFD700, transparent: true, opacity: 0.25 });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = tilt;
  group.add(ring);
  if (!materialMap.has(node.id)) materialMap.set(node.id, []);
  materialMap.get(node.id).push(ringMat);

  const satellites = [];
  for (let i = 0; i < count; i++) {
    const geo = new THREE.SphereGeometry(0.7, 6, 6);
    const mat = new THREE.MeshBasicMaterial({ color: 0xFFD700 });
    const mesh = new THREE.Mesh(geo, mat);
    const offset = i * Math.PI * 2 / count;
    // 3D spherical orbit: rotate XY circle around X-axis by tilt
    mesh.position.set(
      orbitR * Math.cos(offset),
      orbitR * Math.sin(offset) * Math.cos(tilt),
      orbitR * Math.sin(offset) * Math.sin(tilt)
    );
    group.add(mesh);
    satellites.push({ mesh, radius: orbitR, offset, tilt });
    materialMap.get(node.id).push(mat);
  }
  orbitData.set(node.id, { satellites, ring, angle: 0 });
}

function removeOrbit(nodeId) {
  const data = orbitData.get(nodeId);
  if (!data) return;
  data.satellites.forEach(s => {
    if (s.mesh.parent) s.mesh.parent.remove(s.mesh);
    s.mesh.geometry.dispose();
    s.mesh.material.dispose();
  });
  if (data.ring) {
    if (data.ring.parent) data.ring.parent.remove(data.ring);
    data.ring.geometry.dispose();
    data.ring.material.dispose();
  }
  orbitData.delete(nodeId);
}

function markFixedNode(node) {
  const mats = materialMap.get(node.id) || [];
  mats.forEach(m => { m.emissive&&m.emissive.set('#ffffff'); m.emissiveIntensity!==undefined&&(m.emissiveIntensity=0.5); });
}
function fixNode(node, fixed) {
  if (fixed) {
    node.fx = node.x; node.fy = node.y; node.fz = node.z;
    fixedNodes.add(node.id);
    markFixedNode(node);
    // Add orbit satellites to the node's 3D group
    const group = findNodeGroup(node.id);
    if (group && !orbitData.has(node.id)) addOrbitToGroup(group, node);
  } else {
    node.fx = null; node.fy = null; node.fz = null;
    fixedNodes.delete(node.id);
    removeOrbit(node.id);
    const mats = materialMap.get(node.id) || [];
    mats.forEach(m => { m.emissive&&m.emissive.set(NODE_COLORS[node.node_type]||'#888'); m.emissiveIntensity!==undefined&&(m.emissiveIntensity=0.3); });
  }
  // Update panel button if this is the selected node
  if (selectedNode && selectedNode.id === node.id) {
    const unfixBtn = $id('btn-unfix');
    if (unfixBtn) unfixBtn.style.display = fixed ? 'block' : 'none';
  }
}
function unfixAllNodes() {
  fixedNodes.forEach(nid => {
    const gd = graph.graphData();
    const node = gd.nodes.find(n => n.id === nid);
    if (node) { node.fx = null; node.fy = null; node.fz = null; }
    removeOrbit(nid);
  });
  fixedNodes.clear();
  // Reset visuals for all nodes
  const gd = graph.graphData();
  gd.nodes.forEach(n => {
    const mats = materialMap.get(n.id) || [];
    mats.forEach(m => { m.emissive&&m.emissive.set(NODE_COLORS[n.node_type]||'#888'); m.emissiveIntensity!==undefined&&(m.emissiveIntensity=0.3); });
  });
  if (focusNode) applyFocusVisibility();
  // Hide unfix button
  const unfixBtn = $id('btn-unfix');
  if (unfixBtn) unfixBtn.style.display = 'none';
}

// ===== NODE OBJECTS =====
function createNodeObject(node) {
  const group = new THREE.Group();
  nodeGroups.set(node.id, group);
  const r = node.radius * 1.0;
  let geometry;
  if (node.node_type === 'THING') geometry = new THREE.OctahedronGeometry(r);
  else if (node.node_type === 'PERSON') geometry = new THREE.DodecahedronGeometry(r);
  else geometry = new THREE.SphereGeometry(r, 16, 16);

  const color = NODE_COLORS[node.node_type] || '#888';
  const mat = new THREE.MeshStandardMaterial({ color, roughness:0.4, metalness:0.2, emissive:color, emissiveIntensity:0.3 });
  mat.needsUpdate = true;
  const mesh = new THREE.Mesh(geometry, mat);
  group.add(mesh);

  // Register materials
  if (!materialMap.has(node.id)) materialMap.set(node.id, []);
  materialMap.get(node.id).push(mat);

  // Deprecated wireframe
  if (node.deprecated) {
    const wm = new THREE.MeshBasicMaterial({ color:0x888888, wireframe:true });
    group.add(new THREE.Mesh(geometry, wm));
    materialMap.get(node.id).push(wm);
  }

  // Orbit satellites for fixed nodes
  if (fixedNodes.has(node.id)) {
    addOrbitToGroup(group, node);
  }

  return group;
}

(function orbitLoop() {

      s.mesh.position.x = s.radius * Math.cos(a);

// ===== FILTERS =====
function computeMedian() {
  const degs = allNodes.map(n => n.in_degree + n.out_degree).sort((a,b)=>a-b);
  medianDegree = degs[Math.floor(degs.length/2)] || 1;
}

function applyFilters() {
  const visible = allNodes.filter(n => {
    if (!nodeTypeFilters[n.node_type]) return false;
    if (!showDeprecated && n.deprecated) return false;
    if (!showForgotten && n.forgotten) return false;
    if (hideOrphans && n.in_degree===0 && n.out_degree===0) return false;
    if (highDegOnly && (n.in_degree+n.out_degree) < medianDegree) return false;
    return true;
  });
  const vIds = new Set(visible.map(n => n.id));
  const vLinks = allLinks.filter(l => {
    const srcId = (l.source && l.source.id) ? l.source.id : l.source;
    const tgtId = (l.target && l.target.id) ? l.target.id : l.target;
    return vIds.has(srcId) && vIds.has(tgtId) && edgeTypeFilters[l.rel_type];
  });

  if (visible.length === 0) return;

  orbitData.clear();      // old orbits will be rebuilt
  nodeGroups.clear();     // old groups will be rebuilt
  materialMap.clear();    // clear old materials before rebuild
  freezeTick = 200;
  graph.graphData({nodes:visible, links:vLinks});
  graph.d3Force('charge').strength(-30);  // after graphData (which may reset forces)
  // Re-mark fixed nodes (materials were rebuilt)
  if (fixedNodes.size > 0) {
    const gd = graph.graphData();
    gd.nodes.forEach(n => { if (fixedNodes.has(n.id)) markFixedNode(n); });
  }
  graph.d3ReheatSimulation();
  if (focusNode) setTimeout(() => applyFocusVisibility(), 200);

  updateStats(visible.length, vLinks.length);
}

// ===== FOCUS =====
function getNeighbors(nodeId, hops) {
  const visited = new Set([nodeId]);
  let frontier = new Set([nodeId]);
  for (let h=0; h<hops; h++) {
    const next = new Set();
    for (const nid of frontier) {
      allLinks.forEach(l => {
        const srcId = (l.source && l.source.id) ? l.source.id : l.source;
        const tgtId = (l.target && l.target.id) ? l.target.id : l.target;
        if (srcId === nid && !visited.has(tgtId)) { visited.add(tgtId); next.add(tgtId); }
        if (tgtId === nid && !visited.has(srcId)) { visited.add(srcId); next.add(srcId); }
      });
    }
    frontier = next;
  }
  return visited;
}

function enterFocus(node) {
  focusNode = node;
  focusNeighbors = getNeighbors(node.id, 1);
  applyFocusVisibility();
  graph.cameraPosition({x:node.x, y:node.y, z:node.z+150}, node, 2000);
  setText('stat-focus', 'ON');
}

function exitFocus() {
  focusNode = null;
  focusNeighbors.clear();
  applyFocusVisibility();
  setText('stat-focus', 'OFF');
}

function applyFocusVisibility() {
  if (!focusNode) {
    graph.nodeVisibility(() => true);
    graph.linkVisibility(() => true);
    const gd = graph.graphData();
    gd.nodes.forEach(n => {
      const mats = materialMap.get(n.id) || [];
      mats.forEach(m => { m.emissive&&m.emissive.set(NODE_COLORS[n.node_type]||'#888'); m.emissiveIntensity!==undefined&&(m.emissiveIntensity=0.3); });
    });
  } else {
    const visibleSet = new Set([focusNode.id, ...focusNeighbors]);
    graph.nodeVisibility(n => visibleSet.has(n.id));
    graph.linkVisibility(l => {
      const sId = (l.source && l.source.id) ? l.source.id : l.source;
      const tId = (l.target && l.target.id) ? l.target.id : l.target;
      return visibleSet.has(sId) && visibleSet.has(tId);
    });
    // Highlight focus node
    const mats = materialMap.get(focusNode.id) || [];
    mats.forEach(m => { m.emissive&&m.emissive.set('#FFD700'); m.emissiveIntensity!==undefined&&(m.emissiveIntensity=0.8); });
  }
}

      else if (action==='focus2'){ focusNeighbors=getNeighbors(node.id,2); applyFocusVisibility(); }
      else if (action==='hide-node' && node){ highDegOnly=false; hideOrphans=false; allNodes.forEach(n=>{if(n.id===node.id)n.__hidden=true;}); applyFilters(); }
      else if (action==='hide-type' && node){ nodeTypeFilters[node.node_type]=false; refreshChk(); applyFilters(); }
      else if (action==='hide-unrelated'){ const nb=getNeighbors(node.id,1); allNodes.forEach(n=>{n.__hidden=!nb.has(n.id);}); applyFilters(); }
      else if (action==='copy-id' && node){ navigator.clipboard.writeText(node.id); }
      else if (action==='show-all'){ resetAll(); applyFilters(); exitFocus(); }
      else if (action==='hide-all-edges'){ Object.keys(edgeTypeFilters).forEach(k=>edgeTypeFilters[k]=false); refreshChk(); applyFilters(); }
      else if (action==='hide-deprecated'){ showDeprecated=false; document.getElementById('toggle-deprecated').checked=false; applyFilters(); }
      else if (action==='causal-only'){ Object.keys(edgeTypeFilters).forEach(k=>edgeTypeFilters[k]=(k==='causal')); refreshChk(); applyFilters(); }
      hideCtxMenu();
    };
  });
  menu.style.left = e.clientX + 'px';
  menu.style.top = e.clientY + 'px';
  menu.style.display = 'block';
}

function enterEdgeMode(type) {
  if (!selectedNode) return;
  pendingEdgeAction = { type, sourceNode: selectedNode };

  const bar = $id('edge-mode-bar');
  if (bar) {
    bar.className = type;
    bar.textContent = type === 'connect'
      ? `连接模式: 选择边类型并点击目标节点 (点击空白取消)`
      : `删除模式: 点击已连接的目标节点 (点击空白取消)`;
  }
  // Show edge type selector for connect mode
  if (type === 'connect') {
    const detail = $id('node-detail');
    if (detail) {
      const selHtml = `
        <div class="edge-type-select" id="edge-type-sel">
          ${Object.keys(EDGE_COLORS).map(t =>
            `<span class="et-opt" data-et="${t}" style="color:${EDGE_COLORS[t]}">${t}</span>`
          ).join('')}
        </div>
      `;
      detail.insertAdjacentHTML('beforeend', selHtml);
      // Default select first
      const first = document.querySelector('#edge-type-sel .et-opt');
      if (first) { first.classList.add('sel'); pendingEdgeAction.relType = first.dataset.et; }
      document.querySelectorAll('#edge-type-sel .et-opt').forEach(opt => {
        opt.onclick = () => {
          document.querySelectorAll('#edge-type-sel .et-opt').forEach(o => o.classList.remove('sel'));
          opt.classList.add('sel');
          pendingEdgeAction.relType = opt.dataset.et;
        };
      });
    }
  }
  // Change button styles
  const connBtn = $id('btn-connect-edge');
  const discBtn = $id('btn-disconnect-edge');
  if (connBtn) connBtn.textContent = type === 'connect' ? '连接中... 点击目标节点' : '+ 连接边';
  if (discBtn) discBtn.textContent = type === 'disconnect' ? '删除中... 点击目标节点' : '- 删除边';
}

function exitEdgeMode() {
  pendingEdgeAction = null;
  document.body.classList.remove('edge-mode');
  const bar = $id('edge-mode-bar');
  if (bar) { bar.className = ''; bar.textContent = ''; }

  if (discBtn) discBtn.textContent = '- 删除边';
}

function hasEdgeBetween(a, b) {
  return allLinks.some(l => {
    const s = (l.source && l.source.id) ? l.source.id : l.source;
    const t = (l.target && l.target.id) ? l.target.id : l.target;
    return s === a && t === b;
  });
}

async function handleEdgeActionClick(targetNode) {
  const { type, sourceNode, relType } = pendingEdgeAction;
  const sid = sourceNode.id;
  const tid = targetNode.id;
  if (sid === tid) { alert('不能连接自身'); return; }

  if (type === 'connect') {
    if (hasEdgeBetween(sid, tid)) {
      alert(`节点 ${sid} 和 ${tid} 之间已有边连接`);
      return;
    }
    try {
      await apiCall('POST', '/api/edges', { source: sid, target: tid, rel_type: relType });
      const newLink = { source: sid, target: tid, rel_type: relType };
      allLinks.push(newLink);
      pushUndo(`连接边 ${sid}→${tid}`, async () => {
        await apiCall('DELETE', `/api/edges/${sid}/${tid}`);
        const i = allLinks.indexOf(newLink);
        if (i >= 0) allLinks.splice(i, 1);
        applyFilters(); refreshCrudPanel();
      });
      applyFilters();
      updateCrudStatus();
      exitEdgeMode();
      // Refresh CRUD panel if open
      if (crudEditingNode && (crudEditingNode === sid || crudEditingNode === tid)) {
        const n = graph.graphData().nodes.find(nd => nd.id === crudEditingNode);
        if (n) renderCrudEditor(n);
      }
    } catch(e) { alert('创建边失败: ' + e.message); }
  } else if (type === 'disconnect') {
    // Bidirectional check since user may select nodes in either order
    const oldEdge = allLinks.find(l => {
      const s = (l.source && l.source.id) ? l.source.id : l.source;
      const t = (l.target && l.target.id) ? l.target.id : l.target;
      return (s === sid && t === tid) || (s === tid && t === sid);
    });
    if (!oldEdge) {
      alert(`节点 ${sid} 和 ${tid} 之间没有边连接`);
      return;
    }
    try {
      const oldSrc = (oldEdge.source&&oldEdge.source.id)?oldEdge.source.id:oldEdge.source;
      const oldTgt = (oldEdge.target&&oldEdge.target.id)?oldEdge.target.id:oldEdge.target;
      await apiCall('DELETE', `/api/edges/${oldSrc}/${oldTgt}`);
      const idx = allLinks.indexOf(oldEdge);
      if (idx >= 0) allLinks.splice(idx, 1);
      pushUndo(`删除边 ${oldSrc}↔${oldTgt}`, async () => {
        await apiCall('POST', '/api/edges', { source: oldSrc, target: oldTgt, rel_type: oldEdge.rel_type });
        allLinks.push(oldEdge);
        applyFilters(); refreshCrudPanel();
      });
      applyFilters();
      updateCrudStatus();
      exitEdgeMode();
      if (crudEditingNode && (crudEditingNode === sid || crudEditingNode === tid)) {
        const n = graph.graphData().nodes.find(nd => nd.id === crudEditingNode);
        if (n) renderCrudEditor(n);
      }
    } catch(e) { alert('删除边失败: ' + e.message); }
  }
}

      gd.nodes.forEach(n => { n.__searchMatch=false; });

      else { gd.nodes.forEach(n => { const mats=materialMap.get(n.id)||[]; mats.forEach(m=>{m.transparent=false;m.opacity=1;m.emissive&&m.emissive.set(NODE_COLORS[n.node_type]||'#888');m.emissiveIntensity!==undefined&&(m.emissiveIntensity=0.3);}); }); }
      if (searchDd) searchDd.style.display = 'none';
      return;
    }
    const matched = gd.nodes.filter(n => n.content && n.content.toLowerCase().includes(q));
    const matchedIds = new Set(matched.map(n => n.id));
    // Highlight in 3D
    gd.nodes.forEach(n => {
      n.__searchMatch = matchedIds.has(n.id);
      const mats = materialMap.get(n.id) || [];
      if (matchedIds.has(n.id)) {
        mats.forEach(m => { m.transparent=false; m.opacity=1; m.emissive&&m.emissive.set('#00FFFF'); m.emissiveIntensity!==undefined&&(m.emissiveIntensity=0.8); });
      } else if (focusNode && focusNeighbors.has(n.id)) {
        mats.forEach(m => { m.transparent=true; m.opacity=0.2; });
      } else {
        mats.forEach(m => { m.transparent=true; m.opacity=0.03; });
      }
    });
    // Populate dropdown
    if (searchDd) {
      const topN = matched.slice(0, 20);
      searchDd.innerHTML = topN.map(n => `
        <div class="item" data-nid="${n.id}">
          <span class="dot" style="background:${NODE_COLORS[n.node_type]||'#888'}"></span>
          <span class="text">${n.content}</span>
          <span class="type">${n.node_type}</span>
        </div>
      `).join('') || '<div class="item" style="color:rgba(255,255,255,0.3);cursor:default">无匹配结果</div>';
      searchDd.style.display = 'block';
      // Bind clicks
      searchDd.querySelectorAll('.item[data-nid]').forEach(el => {
        el.onclick = () => {
          const node = gd.nodes.find(n => n.id === el.dataset.nid);
          if (node) {
            selectNode(node);
            enterFocus(node);
            if (searchEl) searchEl.value = '';
            searchDd.style.display = 'none';
          }
        };
      });
    }
  }, 150);
};

// ===== CRUD PANEL =====
// 使用当前页面来源，适配本地/容器/远程部署（面板与 /api 同源）
const API_BASE = window.location.origin;
let crudEditingNode = null;    // currently editing node id
let crudListFilter = '';       // search filter text
const undoStack = [];
const MAX_UNDO = 50;

async function apiCall(method, path, body) {
  const url = `${API_BASE}${path}`;
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(url, opts);
  if (!res.ok) {
    const err = await res.json().catch(() => ({ error: res.statusText }));
    throw new Error(err.error || res.statusText);
  }
  return res.json();
}

function pushUndo(label, undoFn) {
  undoStack.push({ label, undoFn });
  if (undoStack.length > MAX_UNDO) undoStack.shift();
  updateCrudStatus();
}

async function doUndo() {
  const action = undoStack.pop();
  if (!action) return;
  try {
    await action.undoFn();
    crudEditingNode = null;
    refreshCrudPanel();
    applyFilters();
    updateCrudStatus();
  } catch(e) { alert('撤销失败: ' + e.message); undoStack.push(action); }
}

function updateCrudStatus() {
  const gd = graph.graphData();
  setText('crud-status', `节点: ${gd.nodes.length} | 边: ${gd.links.length} | 可撤销: ${undoStack.length}`);
}

// ---- Bridge: 3D → CRUD ----
const origSelectNode = selectNode;
selectNode = function(node) {
  origSelectNode(node);
  if (node) {
    crudEditingNode = node.id;
    renderCrudEditor(node);
  } else {
    crudEditingNode = null;
    refreshCrudPanel();
  }
};

// ---- Rendering ----
function refreshCrudPanel() {
  if (crudEditingNode) {
    const gd = graph.graphData();
    const node = gd.nodes.find(n => n.id === crudEditingNode);
    if (node) { renderCrudEditor(node); return; }
    crudEditingNode = null;
  }
  renderCrudList();
  updateCrudStatus();
}

function renderCrudList() {
  const gd = graph.graphData();
  const q = crudListFilter.toLowerCase();
  const filtered = gd.nodes.filter(n => !q || (n.content && n.content.toLowerCase().includes(q)));
  const body = $id('crud-body');
  if (!body) return;
  body.innerHTML = `
    <div class="section-title">节点列表 — 共 ${filtered.length} 个</div>
    ${filtered.length === 0 ? '<div class="empty-state">无匹配节点</div>' : ''}
    ${filtered.slice(0, 100).map(n => `
      <div class="node-list-item" data-nid="${n.id}">
        <span class="dot" style="background:${NODE_COLORS[n.node_type]||'#888'}"></span>
        <span class="content">${n.content||'(空)'}</span>
        <span class="ntype">${n.node_type}</span>
      </div>
    `).join('')}
  `;
  body.querySelectorAll('.node-list-item').forEach(el => {
    el.onclick = () => {
      const node = gd.nodes.find(n => n.id === el.dataset.nid);
      if (node) { crudEditingNode = node.id; renderCrudEditor(node); }
    };
  });
}

function renderCrudEditor(node) {
  const body = $id('crud-body');
  if (!body) return;
  const edges = getNodeEdges(node.id);
  body.innerHTML = `
    <div class="edit-section">
      <label>节点 ID</label>
      <input type="text" value="${node.id}" disabled style="opacity:0.5">
      <label>类型</label>
      <select id="crud-edit-type">
        ${Object.keys(NODE_COLORS).map(t => `<option value="${t}" ${node.node_type===t?'selected':''}>${t}</option>`).join('')}
      </select>
      <label>内容</label>
      <textarea id="crud-edit-content" placeholder="节点内容...">${node.content||''}</textarea>
      <label>状态: ${node.deprecated?'⚠ 已废弃':''} ${node.forgotten?'☠ 已遗忘':''} ${fixedNodes.has(node.id)?'📌 已固定':''}</label>
    </div>
    <div class="section-title">关联边 (入${node.in_degree} 出${node.out_degree})</div>
    ${edges.length === 0 ? '<div class="edge-item" style="color:rgba(255,255,255,0.2)">无关联边</div>' : ''}
    ${edges.map(e => `
      <div class="edge-item">
        <span class="arrow">${e.direction==='in'?'←':'→'}</span>
        <span class="rel" style="background:${EDGE_COLORS[e.rel_type]||'#666'};color:#fff">${e.rel_type}</span>
        <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${e.peerContent||e.peerId}</span>
        <button class="del-btn" data-del="${e.peerId}" title="删除此边">×</button>
      </div>
    `).join('')}
    <div class="edit-actions">
      <button class="primary" id="crud-btn-save">保存</button>
      <button id="crud-btn-deprecate">${node.deprecated?'恢复':'废弃'}</button>
      <button class="danger" id="crud-btn-delete">删除节点</button>
      <button id="crud-btn-back" style="margin-left:auto">← 返回列表</button>
    </div>
  `;
  // Bind delete edge buttons
  body.querySelectorAll('.del-btn').forEach(btn => {
    btn.onclick = async () => {
      const peerId = btn.dataset.del;
      if (!confirm(`删除边 ${node.id} ↔ ${peerId}？`)) return;
      try {
        const oldEdge = allLinks.find(l => {
          const s = (l.source&&l.source.id)?l.source.id:l.source;
          const t = (l.target&&l.target.id)?l.target.id:l.target;
          return (s===node.id&&t===peerId) || (s===peerId&&t===node.id);
        });
        if (!oldEdge) return;
        const oldSrc = (oldEdge.source&&oldEdge.source.id)?oldEdge.source.id:oldEdge.source;
        const oldTgt = (oldEdge.target&&oldEdge.target.id)?oldEdge.target.id:oldEdge.target;
        await apiCall('DELETE', `/api/edges/${oldSrc}/${oldTgt}`);
        const idx = allLinks.indexOf(oldEdge);
        if (idx >= 0) allLinks.splice(idx, 1);
        pushUndo(`删除边 ${oldSrc}↔${oldTgt}`, async () => {
          await apiCall('POST', '/api/edges', { source: oldSrc, target: oldTgt, rel_type: oldEdge.rel_type });
          allLinks.push(oldEdge);
          applyFilters(); refreshCrudPanel();
        });
        applyFilters();
        const refNode = graph.graphData().nodes.find(n => n.id === node.id) || node;
        if (refNode) renderCrudEditor(refNode);
        updateCrudStatus();
      } catch(e) { alert('删除边失败: ' + e.message); }
    };
  });
  // Bind save button
  const saveBtn = $id('crud-btn-save');
  if (saveBtn) saveBtn.onclick = () => saveCrudNode(node);
  const depBtn = $id('crud-btn-deprecate');
  if (depBtn) depBtn.onclick = () => toggleDeprecateNode(node);
  const delBtn = $id('crud-btn-delete');
  if (delBtn) delBtn.onclick = () => deleteCrudNode(node);
  const backBtn = $id('crud-btn-back');
  if (backBtn) backBtn.onclick = () => { crudEditingNode = null; refreshCrudPanel(); };
}

function getNodeEdges(nid) {
  const edges = [];
  allLinks.forEach(l => {
    const s = (l.source&&l.source.id)?l.source.id:l.source;
    const t = (l.target&&l.target.id)?l.target.id:l.target;
    if (s === nid) {
      const peer = allNodes.find(n => n.id === t);
      edges.push({ direction:'out', rel_type: l.rel_type, peerId: t, peerContent: peer?peer.content:t });
    }
    if (t === nid) {
      const peer = allNodes.find(n => n.id === s);
      edges.push({ direction:'in', rel_type: l.rel_type, peerId: s, peerContent: peer?peer.content:s });
    }
  });
  return edges;
}

async function saveCrudNode(node) {
  const typeEl = $id('crud-edit-type');
  const contentEl = $id('crud-edit-content');
  if (!typeEl || !contentEl) return;
  const newType = typeEl.value;
  const newContent = contentEl.value;
  const oldType = node.node_type;
  const oldContent = node.content;
  try {
    await apiCall('PUT', `/api/nodes/${node.id}`, { node_type: newType, content: newContent });
    node.node_type = newType;
    node.content = newContent;
    pushUndo(`更新 ${node.id}`, async () => {
      await apiCall('PUT', `/api/nodes/${node.id}`, { node_type: oldType, content: oldContent });
      node.node_type = oldType;
      node.content = oldContent;
      applyFilters(); refreshCrudPanel();
    });
    applyFilters();
    const saved = graph.graphData().nodes.find(n => n.id === node.id);
    if (saved) renderCrudEditor(saved);
    updateCrudStatus();
  } catch(e) { alert('保存失败: ' + e.message); }
}

async function toggleDeprecateNode(node) {
  const newVal = !node.deprecated;
  try {
    await apiCall('PUT', `/api/nodes/${node.id}`, { deprecated: newVal });
    const oldVal = node.deprecated;
    node.deprecated = newVal;
    pushUndo(`${newVal?'废弃':'恢复'} ${node.id}`, async () => {
      await apiCall('PUT', `/api/nodes/${node.id}`, { deprecated: oldVal });
      node.deprecated = oldVal;
      applyFilters(); refreshCrudPanel();
    });
    applyFilters();
    const toggled = graph.graphData().nodes.find(n => n.id === node.id);
    if (toggled) renderCrudEditor(toggled);
    updateCrudStatus();
  } catch(e) { alert('操作失败: ' + e.message); }
}

async function deleteCrudNode(node) {
  if (!confirm(`确认删除节点 ${node.id} (${node.content?.substring(0,30)})？\n关联边将被一并删除。`)) return;
  try {
    // Collect related edges BEFORE API call
    const removedEdges = [];
    for (let i = allLinks.length-1; i >= 0; i--) {
      const l = allLinks[i];
      const s = (l.source&&l.source.id)?l.source.id:l.source;
      const t = (l.target&&l.target.id)?l.target.id:l.target;
      if (s === node.id || t === node.id) removedEdges.push({...l, _src: s, _tgt: t});
    }
    // API first, then local state
    await apiCall('DELETE', `/api/nodes/${node.id}`);
    if (focusNode && focusNode.id === node.id) exitFocus();
    if (selectedNode && selectedNode.id === node.id) selectNode(null);
    const idx = allNodes.indexOf(node);
    if (idx >= 0) allNodes.splice(idx, 1);
    // Remove related edges from local state
    removedEdges.forEach(re => {
      const ei = allLinks.indexOf(re);
      if (ei >= 0) allLinks.splice(ei, 1);
    });
    const savedNode = { id: node.id, node_type: node.node_type, content: node.content,
      deprecated: node.deprecated, forgotten: node.forgotten, in_degree: node.in_degree,
      out_degree: node.out_degree, radius: node.radius };
    pushUndo(`删除节点 ${node.id}`, async () => {
      await apiCall('POST', '/api/nodes', { node_type: savedNode.node_type, content: savedNode.content });
      allNodes.push(savedNode);
      removedEdges.forEach(e => allLinks.push(e));
      applyFilters(); refreshCrudPanel();
    });
    crudEditingNode = null;
    applyFilters();
    refreshCrudPanel();
  } catch(e) { alert('删除失败: ' + e.message); }
}

function showCrudModal(title, bodyHtml, onConfirm) {
  const overlay = document.createElement('div');
  overlay.className = 'crud-modal-overlay';
  overlay.innerHTML = `<div class="crud-modal"><h3>${title}</h3>${bodyHtml}<div class="actions"><button id="modal-cancel">取消</button><button class="primary" id="modal-confirm">确认</button></div></div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#modal-cancel').onclick = () => overlay.remove();
  overlay.querySelector('#modal-confirm').onclick = () => { const ok = onConfirm(overlay); if (ok !== false) overlay.remove(); };
  overlay.onclick = e => { if (e.target === overlay) overlay.remove(); };
}

// ---- Toolbar handlers ----
$id('crud-btn-new-node')?.addEventListener('click', () => {
  showCrudModal('新建节点', `
    <label>类型</label>
    <select id="modal-node-type">${Object.keys(NODE_COLORS).map(t => `<option value="${t}">${t}</option>`).join('')}</select>
    <label>内容</label>
    <textarea id="modal-node-content" placeholder="节点内容..."></textarea>
  `, async (overlay) => {
    const nt = overlay.querySelector('#modal-node-type').value;
    const content = overlay.querySelector('#modal-node-content').value;
    if (!content.trim()) { alert('请输入内容'); return false; }
    try {
      const result = await apiCall('POST', '/api/nodes', { node_type: nt, content });
      const newNode = { id: result.id, node_type: nt, content, deprecated: false, forgotten: false,
        in_degree: 0, out_degree: 0, radius: (['STATUS','REASON','ACTION'].includes(nt)?5.5:4.5) };
      allNodes.push(newNode);
      pushUndo(`新建节点 ${result.id}`, async () => {
        await apiCall('DELETE', `/api/nodes/${result.id}`);
        const i = allNodes.findIndex(n => n.id === result.id);
        if (i >= 0) allNodes.splice(i, 1);
        applyFilters(); refreshCrudPanel();
      });
      applyFilters();
      crudEditingNode = result.id;
      setTimeout(() => { const gd = graph.graphData(); const n = gd.nodes.find(nd => nd.id === result.id); if (n) renderCrudEditor(n); }, 100);
      updateCrudStatus();
    } catch(e) { alert('创建失败: ' + e.message); }
  });
});

$id('crud-btn-new-edge')?.addEventListener('click', () => {
  const gd = graph.graphData();
  const nodeOpts = gd.nodes.map(n => `<option value="${n.id}">${n.id} - ${(n.content||'').substring(0,30)}</option>`).join('');
  showCrudModal('新建边', `
    <label>源节点</label>
    <select id="modal-edge-src">${nodeOpts}</select>
    <label>目标节点</label>
    <select id="modal-edge-tgt">${nodeOpts}</select>
    <label>边类型</label>
    <select id="modal-edge-type">${Object.keys(EDGE_COLORS).map(t => `<option value="${t}">${t}</option>`).join('')}</select>
  `, async (overlay) => {
    const src = overlay.querySelector('#modal-edge-src').value;
    const tgt = overlay.querySelector('#modal-edge-tgt').value;
    const rel = overlay.querySelector('#modal-edge-type').value;
    if (src === tgt) { alert('源节点和目标节点不能相同'); return false; }
    try {
      await apiCall('POST', '/api/edges', { source: src, target: tgt, rel_type: rel });
      const newLink = { source: src, target: tgt, rel_type: rel };
      allLinks.push(newLink);
      pushUndo(`新建边 ${src}→${tgt}`, async () => {
        await apiCall('DELETE', `/api/edges/${src}/${tgt}`);
        const i = allLinks.indexOf(newLink);
        if (i >= 0) allLinks.splice(i, 1);
        applyFilters(); refreshCrudPanel();
      });
      applyFilters();
      if (crudEditingNode && (crudEditingNode === src || crudEditingNode === tgt)) {
        const n = graph.graphData().nodes.find(nd => nd.id === crudEditingNode);
        if (n) renderCrudEditor(n);
      }
      updateCrudStatus();
    } catch(e) { alert('创建失败: ' + e.message); }
  });
});

$id('crud-btn-undo')?.addEventListener('click', doUndo);
$id('crud-btn-export')?.addEventListener('click', async () => {

});

// Titlebar drag
(function() {
  const panel = $id('crud-panel');
  const titlebar = $id('crud-titlebar');
  if (!panel || !titlebar) return;
  let dragging = false, ox = 0, oy = 0;
  titlebar.onmousedown = e => {
    dragging = true;
    ox = e.clientX - panel.offsetLeft;
    oy = e.clientY - panel.offsetTop;
    panel.style.transition = 'none';
  };
  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    panel.style.left = (e.clientX - ox) + 'px';
    panel.style.top = (e.clientY - oy) + 'px';
    panel.style.bottom = 'auto';
    panel.style.right = 'auto';
  });
  document.addEventListener('mouseup', () => { dragging = false; panel.style.transition = ''; });
})();

// Initial refresh
updateCrudStatus();
