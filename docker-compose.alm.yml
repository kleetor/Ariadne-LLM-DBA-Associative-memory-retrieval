# Ariadne ALM — Agent Memory Leaderboard 接入（参赛方**自托管**部署）
#
# ⚠️ 第二期新规：所有参赛组别都必须**由参赛方自行部署** Add / Search API，平台不代为
#    部署，也不接受只提交 GitHub 仓库 / Docker 镜像 / 启动说明。因此本文件不是"交付物"，
#    而是**我们自己把服务跑在公网**的部署清单；仓库与镜像只用于开放性、署名与复现审核。
#
# 与 docker-compose.yml（MCP 服务）的区别：
#   1. 入口是 ariadne-alm，暴露同步 Add / Search / Health；
#   2. 必须有公网入口（平台从外部调用），不能像 MCP 那样只在内网可达；
#   3. 记忆必须持久化（见下方「持久化」——自托管下这是硬要求，不再是兜底）；
#   4. 默认走 API embedding（镜像小）。服务本就必须出网访问 LLM 端点，
#      所以本地向量模型买不到离线收益，只多背 GB 级体积。
#
# 自托管带来的四项硬要求（旧"把镜像交给维护团队部署"的假设已失效）：
#   1. **公网 HTTPS 可达**：平台拒绝解析到私网 / 回环 / 链路本地地址的 URL，URL 内也
#      不得含凭据。仅绑 127.0.0.1 不可用；本服务自身不做 TLS，需前置反向代理
#      （Nginx / Caddy）终止证书后转发到 8770。
#   2. **鉴权必须开启**：`ALM_API_KEYS` 不能为空。为空时服务放行所有请求（见
#      alm/server.py `_authorized`），公网暴露等于把记忆库完全开放。
#   3. **常驻与持久化由我方负责**：容器需长驻（`restart: unless-stopped`），
#      `/data` 必须挂持久卷，否则重启后 Search 找不到此前 Add 写入的内容。
#   4. **出网与凭据由我方提供**：LLM / embedding 的端点与密钥从宿主机环境注入，
#      平台不注入任何凭据。
#
# 用法（自托管）：
#   1) 在 .env.alm 里补齐两项，缺任一项服务都会在启动时报错而不是静默跑偏：
#      - ALM_API_KEYS：非空（即提交给平台的 Memory System Key）
#      - EMBEDDING_MODEL：与 EMBEDDING_API_BASE 对应的模型名
#      LLM / embedding 的端点与密钥也都在 .env.alm（工业榜单不限制 Add / Search
#      使用的模型；该限制只存在于开源方法榜）。给 ALM 单配一套端点就改这一个文件。
#   2) docker compose --env-file .env.alm -f docker-compose.alm.yml up -d --build
#      （带上 --env-file 是为了让端口插值也走同一个文件；只用 -f 时端口取默认 8770）
#   3) 自测：python -m alm.smoke --base-url http://127.0.0.1:8770 --api-key <key>
#   4) 前置反向代理终止 TLS，把公网域名（如 https://alm.example.com）转发到本服务
#
# 持久化：容器内 /data 存放各 user_id 的记忆 YAML 与 <user_id>.index/。
#   旧方案里这个卷是"以防平台按 user_id 重启容器"的兜底；自托管后它是**必需项**——
#   容器重启、镜像升级、宿主机维护都必须保住它，否则同一次评测内 Add 与 Search 就断了。

services:
  ariadne-alm:
    build:
      context: .
      dockerfile: Dockerfile.alm
      args:
        # 刻意用 ALM_EMBEDDING_LOCAL 而不是 EMBEDDING_LOCAL：compose 会用项目根的 .env
        # 做变量插值，而 .env 里的 EMBEDDING_LOCAL=1 是给本地开发用的（本地模型），
        # 直接透传会把 GB 级 torch + 向量模型拖进镜像。默认 false = API embedding。
        # 改为 true 时，模型在构建期预下载进镜像，运行期只读缓存（HF_HUB_OFFLINE=1）。
        EMBEDDING_LOCAL: "${ALM_EMBEDDING_LOCAL:-false}"
        EMBEDDING_MODEL: "${ALM_EMBEDDING_MODEL:-BAAI/bge-m3}"
    # 固定产品版本。用版本 tag 而非 latest：商业榜以「固定产品版本」为提交项，
    # 且 Full 复核有一条 "Version matches"——镜像 tag 与申报版本同名，复核时
    # `docker compose ps` 一眼可核。改动版本时这里、申报材料、镜像 tag 三处同步。
    image: ariadne-alm:v0.1.5-alm
    container_name: ariadne-alm
    restart: unless-stopped

    # 日志轮转。默认的 json-file 驱动**既无上限也无轮转**，而评测期接口要连续可访问
    # 30 天以上（见顶部「可访问期」），不设会让容器日志无限增长。
    #
    # 注意这些日志**不随 alm.cleanup 删除**——清理只按 user_id 删 /data 下的图谱与
    # 索引，碰不到 /var/lib/docker/containers/ 里的日志文件。所以留存窗口只能由这里的
    # 轮转来界定，不能指望「30 天内删除评测数据」这条义务去覆盖它。
    #
    # 容量标定（0930）：开启 `ALM_TRACE_IO` 后每条检索会写**完整题面 + 选项 + 叙事**
    # （最长的单据可达数 MB——平台上确有把整份文档当 query 送进来的轨道）。实测 smoke
    # 量级 46 次检索 ≈ 2 MB，即**每次检索约 44 KB**；Full 的检索次数与输入长度都高一个
    # 量级，故 10m×3=30MB 会在早期就把证据轮转掉。这里按 **100m × 10 = 1 GB** 标定：
    # Full 一整轮足够，且给了兜底上限（不会像 30 天常驻那样无限增长）。
    # 若不打算开留痕，或不看历史证据，可调回 10m×3——**改完必须 recreate 容器**才对
    # 已存在的容器生效（logging 是创建期配置，`restart` 不生效）。
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"

    # 公网入口。二选一：
    #   - 前置反向代理（推荐，AML 要求 HTTPS）：只绑回环，由反代终止 TLS 并对外 —— 用下面第一行
    #   - 平台直连本端口（需自行保障 HTTPS，如云 LB）：绑 0.0.0.0 —— 用下面第二行
    ports:
      # 两侧必须同为 ${ALM_PORT}：容器内的监听端口也由同一个变量决定
      # （Dockerfile.alm 的 CMD 用 --port "${ALM_PORT:-8770}"）。若容器侧写死 8770，
      # 改过 ALM_PORT 后公网入口会错位，而容器内 healthcheck 仍走 ${ALM_PORT} 因而照常通过，
      # 表现为「容器健康但平台打不通」。
      - "127.0.0.1:${ALM_PORT:-8770}:${ALM_PORT:-8770}"
      # - "${ALM_PORT:-8770}:${ALM_PORT:-8770}"

    env_file:
      # ALM 专属，与给 MCP / 可视化面板用的根目录 .env 完全分离（后者含
      # ARIADNE_* / NEO4J_* / JUDGE_* 等，ALM 一个都不读）。改端点 / 密钥只改这一个文件。
      - .env.alm
    environment:
      # ---- 此处只保留必须由 compose 钉死的项 ----
      # OPENAI_* / EMBEDDING_API_BASE / EMBEDDING_API_KEY / EMBEDDING_MODEL /
      # ALM_API_KEYS / ALM_LLM_THINKING 一律由 .env.alm 提供，**不再在此透传**：
      # environment 优先级高于 env_file，而这些值靠 ${VAR} 插值，插值源是 shell 与
      # 项目根 .env（**不含** .env.alm）——透传会把它们插值成空串，反而清掉正确取值。
      #
      # 容器内固定监听 0.0.0.0，否则宿主/反代无法访问
      ALM_HOST: "0.0.0.0"
      ALM_PORT: "${ALM_PORT:-8770}"
      ALM_DATA_DIR: "${ALM_DATA_DIR:-/data}"

      # 无条件指向 API embedding：本地开发用的根目录 .env 里是 EMBEDDING_LOCAL=1，
      # 一旦漏进来容器就会去找镜像中并不存在的本地向量模型。
      # 仅在**构建期**传 --build-arg EMBEDDING_LOCAL=true 预置本地模型时，
      # 才需在 shell 里设 ALM_EMBEDDING_LOCAL=true 覆盖此处的默认值。
      EMBEDDING_LOCAL: "${ALM_EMBEDDING_LOCAL:-false}"

    volumes:
      # 自托管下的必需项：进程重启、镜像升级、宿主机维护都不能丢 /data
      - alm-data:/data

    # HEALTHCHECK 在镜像内定义（GET /health，无需鉴权）
    # 平台会主动探活：http://<公网域名>/health（反代需把该路径一并转发）

    # 合规：AML 要求评测数据仅用于本次评测，并在任务结束后 30 天内删除。
    # 记忆只在 /data 下落盘，共**四份**产物：
    #   <user_id>.yaml / <user_id>.index/            —— 记忆图谱与其向量索引
    #   <user_id>.docs.yaml / <user_id>.docs.index/  —— 非图内容区（长文档 / 未抽出的原文）
    # 四份必须由 alm.cleanup 按**同一空间、同一轮**删除（已按 .docs 后缀归组），
    # 否则会出现「图谱按期删了、装原文的文档区还留着」——那正是留存条款要避免的。
    # 日志不含正文。
    #
    # ⚠️ 两条约束互相牵扯，顺序不能错：
    #   ① 规则同时要求「接口在提交后至少 30 天稳定可访问」——**不能评测一结束就停服**。
    #      材料截止 10/31、评测停止 11/4，接口至少需维持到 11 月底之后。
    #   ② 清理必须先停服务：引擎退出时会把内存中驻留的空间重新落盘（engine.close()），
    #      在服务运行期删除文件会被这一步写回来。
    # 因此正确顺序是【等 ≥30 天可访问期结束后】再清理：
    #   docker compose -f docker-compose.alm.yml stop ariadne-alm
    #   docker compose -f docker-compose.alm.yml run --rm --no-deps ariadne-alm \
    #     python -m alm.cleanup --older-than-days 30            # 预演，核对清单
    #   docker compose -f docker-compose.alm.yml run --rm --no-deps ariadne-alm \
    #     python -m alm.cleanup --older-than-days 30 --apply    # 执行
    #   清理执行完，本次评测的接口运维义务才算结束。

volumes:
  alm-data:
