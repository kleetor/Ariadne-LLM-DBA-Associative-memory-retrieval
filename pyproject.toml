[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ariadne"
dynamic = ["version"]
description = "Ariadne: LLM DBA管理与目的驱动的联想记忆检索系统 — A thread through the labyrinth of memory"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    {name = "Ariadne Contributors"},
]

dependencies = [
    "networkx>=3.4.2,<4",
    "numpy>=2.2.6,<3",
    "pyyaml>=6.0.3,<7",
    "langchain>=1.4.6,<2",
    "langchain-openai>=1.7.2,<2",
    "langchain-community>=0.4.2,<2",
    "faiss-cpu>=1.15.1,<2",
    "requests>=2.34.2,<3",
    "mcp>=2.3.0,<3",
    "uvicorn>=0.54.0,<1",
    "starlette>=1.7.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
local = [
    "sentence-transformers>=6.1.0",
    "torch>=2.14.1",
]

[project.scripts]
ariadne-api = "dba_pipeline.viz.api_server:main"
ariadne-mcp = "dba_pipeline.mcp_server:main"
ariadne-render = "dba_pipeline.viz.renderer:main"
ariadne-alm = "alm.server:main"
ariadne-alm-cleanup = "alm.cleanup:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dba_pipeline*", "alm*"]

[tool.setuptools.dynamic]
version = {attr = "dba_pipeline.__version__"}

[tool.setuptools.package-data]
# 静态前端要随包一起安装：容器里 `ariadne-api`（控制台脚本）从 site-packages 导入，
# 漏声明就会导致 /static/icon.png 与 /static/graph.json 404（本地从源码树跑则正常，
# 因此这个问题只在 pip 安装/容器里出现）。
dba_pipeline = [
    "viz/static/*.html",
    "viz/static/*.png",
    "viz/static/*.json",
    "viz/static/css/*.css",
    "viz/static/js/*.js",
]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["memory", "Plan", "Server", "website", "models", "frameworks", "eval"]

[tool.ruff.lint]
# 先以低风险规则建立门禁；I/UP/B/SIM 等规则待单独批次清理后再启用。
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: 需要外部网络或真实 API Key 的用例",
    "e2e: 端到端用例",
]

[tool.coverage.run]
source = ["dba_pipeline", "alm"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
